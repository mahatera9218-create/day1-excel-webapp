# 영어권 글로벌 채널 — Mr.Untold (호기심/상상: "만약에 ~라면?" 중심)

name: world
title_prefix: ""

concept: >
  Mr.Untold is a HISTORY channel that makes the past outrageous, bold and deliciously cheeky —
  tabloid energy, documentary truth. The subject is history and the world's people, but told
  with swagger, sass and a devilish wink, never as a dry lecture. Core format: fact-grounded
  "What if?" plus jaw-dropping "untold" TRUE stories, each led by the most SHOCKING, taboo-
  flirting, "no way that's real" angle you can find. Go as BOLD and provocative as possible —
  but stay 100% TRUE (no made-up facts) and advertiser-safe (imply the scandalous/dark bits,
  never show gore or anything explicit). Mostly light & cheeky, ~1 in 4 deeper for variety.
  HOOKING IS EVERYTHING: titles and thumbnails must stop the scroll cold AND provoke pure
  curiosity — they open a question in the viewer's head and NEVER reveal the answer, the twist or
  the punchline (the video is the only place to find out). Do NOT start every title with "What
  if" — hit hard with shock claims, dares, "The man who…", numbers, forbidden teases, all
  WITHHOLDING the payoff. Plain, punchy language with attitude. For a global audience that loves
  history made addictive and a little scandalous.

language: English

# 쉬운 말 규칙: 역사학자·마니아 용어 금지. 초등학생·역사 입문자도 이해할 쉬운 단어로
# 스크립트와 자막을 쓴다. (린트가 어려운 단어를 막음)
plain_language: true

# 대륙 로테이션: 발행을 아래 5개 대륙에 고르게 돌리고 특정 국가에 편중하지 않는다.
continents:
  - Asia
  - Europe
  - Americas
  - Africa
  - Oceania

visual_style: >
  cinematic historical illustration, warm painterly tone, era-accurate detail,
  documentary mood, dramatic natural lighting, no text, no logos, no modern objects

# 기본 제공(premade) 목소리는 무료 플랜 API 로도 사용 가능.
# 보이스 라이브러리 목소리는 유료(Starter 이상) 필요.
# Adam = 깊고 따뜻한 미국 남성 내레이터. 다른 목소리는 ElevenLabs Voices 에서 ID 복사해 교체.
voice_id: "pNInz6obpgDQGcFmaJgB"
narrator_note: a warm, curious English storyteller voice, engaging and documentary-like

length:
  target_minutes: 5           # 다작 전략. (참고: 8분↑이어야 중간광고 가능)
  min_scenes: 20              # 그림 적당히(컷 ~8-10초) → 비용 절감
  max_scenes: 34
  video_scene_ratio: 0.0      # 비싼 영상변환은 기본 꺼둠 (그림만)

engines:
  mode: real
  tts: edge                   # edge(무료 Microsoft) | elevenlabs(유료, voice_id 필요)
  edge_voice: en-US-ChristopherNeural   # 깊고 따뜻한 미국 남성. 목록은 `edge-tts --list-voices`
  image_model: bytedance/seedream-5.0-pro/text-to-image
  video_model: minimax/h3/image-to-video
  image_resolution: "1024"
  video_resolution: 480p
  price_per_image_usd: 0.04
  price_per_video_second_usd: 0.02
  max_cost_usd: 8

subtitles:
  enabled: true
  font: "Noto Sans KR"          # 이 폰트는 영문 글자도 포함합니다.
  font_size: 42
  primary_color: "FFFFFF"
  highlight_color: "FFD400"
  outline: 4
  margin_v: 90

music:
  # 번들된 앰비언트 배경음. 원하는 곡으로 바꾸려면 파일을 넣고 이 경로를 바꾸세요
  # (유튜브 오디오 라이브러리 무료곡 추천). cwd=youtube-auto 기준 상대경로.
  bgm_path: "autotube/assets/music/ambient_folk.mp3"
  bgm_volume: 0.14

shorts:
  enabled: true
  count: 2            # 편당 전용 티저 2편 (plan["shorts"] 에 대본 작성)
  max_seconds: 55

youtube:
  privacy: private
  category_id: "24"          # 24=엔터테인먼트 (27=교육, 25=뉴스·정치)
  made_for_kids: false
  ai_disclosure: false       # AI 제작 표시(설명 문구 + 합성콘텐츠 플래그) 끔
  client_secret_file: client_secret.json
