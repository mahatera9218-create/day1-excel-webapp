# 영어권 글로벌 채널 — 세계 야담 (전 세계의 기이한 전설·귀신·괴담)

name: world
title_prefix: ""

concept: >
  Atmospheric retellings of the world's eerie folklore and ghost lore — vengeful
  spirits, cursed places, haunted roads, strange disappearances and creatures of the
  night, one culture at a time. Calm, suspenseful narration made for listening in the
  dark. A strong hook in the first 5 seconds, a slow build of dread, and an ending that
  lingers. Respectful and well-researched; unsettling and mysterious, never gory or
  exploitative. For a global English-speaking audience who keep it playing at night.

language: English

visual_style: >
  moody folklore illustration, candlelight and moonlight, drifting fog, deep shadows,
  muted desaturated color, painterly texture, cinematic and eerie, no text, no logos

