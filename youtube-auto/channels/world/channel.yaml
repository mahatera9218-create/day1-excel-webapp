# 영어권 글로벌 채널 — 세계 각국의 민담·전설·신화 (대륙별·국가별)

name: world
title_prefix: ""

concept: >
  A calm, atmospheric storytelling channel retelling folk tales, legends and myths
  from every corner of the world — one country or culture at a time. Respectful,
  well-researched, never mocking. Hooks within the first 5 seconds, a clear narrative
  arc, and an ending that invites the next tale. Aimed at a global English-speaking
  audience who keep it playing while relaxing or working.

language: English

visual_style: >
  painterly folklore illustration, rich atmospheric lighting, culturally respectful
  and era-appropriate detail, muted cinematic color, soft texture, no text, no logos

