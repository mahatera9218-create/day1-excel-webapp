# 영어권 글로벌 채널 — 세계 야담 (숨겨진 옛이야기·흥미로운 실화와 일화)

name: world
title_prefix: ""

concept: >
  Provocative, imagination-stirring true stories from world history — scandals, forbidden
  love, power and betrayal, shocking events and unsolved mysteries that make people lean
  in and think "no way that's real." Bold, teasing hooks in the first 5 seconds, juicy
  details, and cliffhangers that keep them watching. Sensational in TONE but grounded in
  FACT (no invented details) and kept advertiser-safe: suggestive and dramatic, but never
  sexually explicit and never gory. For a global English-speaking audience that loves a
  jaw-dropping "did you know" story.

language: English

visual_style: >
  cinematic historical illustration, warm painterly tone, era-accurate detail,
  documentary mood, dramatic natural lighting, no text, no logos, no modern objects

# 기본 제공(premade) 목소리는 무료 플랜 API 로도 사용 가능.
# 보이스 라이브러리 목소리는 유료(Starter 이상) 필요.
# Adam = 깊고 따뜻한 미국 남성 내레이터. 다른 목소리는 ElevenLabs Voices 에서 ID 복사해 교체.
voice_id: "pNInz6obpgDQGcFmaJgB"
narrator_note: a warm, curious English storyteller voice, engaging and documentary-like

length:
  target_minutes: 5           # 다작 전략. (참고: 8분↑이어야 중간광고 가능)
  min_scenes: 24
  max_scenes: 45
  video_scene_ratio: 0.12

engines:
  mode: real
  image_model: bytedance/seedream-5.0-pro/text-to-image
  video_model: minimax/h3/image-to-video
  image_resolution: "1024"
  video_resolution: 480p
  price_per_image_usd: 0.04
  price_per_video_second_usd: 0.02
  max_cost_usd: 8

subtitles:
  enabled: true
  font: "Noto Sans KR"          # 이 폰트는 영문 글자도 포함합니다.
  font_size: 42
  primary_color: "FFFFFF"
  highlight_color: "FFD400"
  outline: 4
  margin_v: 90

music:
  # 번들된 앰비언트 배경음. 원하는 곡으로 바꾸려면 파일을 넣고 이 경로를 바꾸세요
  # (유튜브 오디오 라이브러리 무료곡 추천). cwd=youtube-auto 기준 상대경로.
  bgm_path: "autotube/assets/music/ambient_folk.mp3"
  bgm_volume: 0.14

shorts:
  enabled: true
  count: 3
  max_seconds: 55

youtube:
  privacy: private
  category_id: "24"
  made_for_kids: false
  client_secret_file: client_secret.json
