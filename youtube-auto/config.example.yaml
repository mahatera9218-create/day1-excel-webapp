# 복사해서 config.yaml 로 이름을 바꾼 뒤 수정하세요.

channel:
  # 채널 콘셉트 — 대본 톤과 소재 선택의 기준이 됩니다. 구체적일수록 좋습니다.
  concept: >
    호기심을 자극하는 과학·자연·역사 미스터리를 짧고 강렬하게 풀어주는 한국어 쇼츠 채널.
    첫 2초 안에 시청자를 붙잡는 질문이나 충격적인 사실로 시작하고,
    마지막은 다음 영상이 궁금해지게 끝낸다.
  language: Korean          # 내레이션 언어 (Pika 대사 태그에 그대로 들어감)
  # 모든 장면에 공통으로 붙는 화풍 — 장면끼리 톤이 튀지 않게 해 줍니다.
  visual_style: >
    cinematic documentary look, photorealistic, natural lighting,
    consistent teal-and-amber color grade, shallow depth of field
  narrator_voice: a calm, deep male documentary narrator voice

video:
  format: shorts            # shorts(세로 9:16) | long(가로 16:9)
  target_seconds: 50        # 전체 목표 길이 (쇼츠는 60초 이하 권장)
  min_scenes: 4
  max_scenes: 6

claude:
  model: claude-opus-5-5
  effort: high              # low | medium | high | xhigh | max

pika:
  base_url: https://api.dev.pika.art
  # 사용할 모델 경로. Pika 대시보드(dev.pika.art)의 모델 페이지에서 확인 후 바꿀 수 있습니다.
  model_path: minimax/h3/text-to-video
  resolution: 768p
  price_per_second_usd: 0.08   # 비용 미리 계산용 (768p 기준, 요금 바뀌면 수정)
  max_cost_usd: 10             # 영상 1편당 상한. 넘으면 생성을 시작하지 않습니다.
  poll_interval_seconds: 10
  timeout_minutes: 20
  # 요청 본문에 추가로 넣을 값 (모델별 파라미터가 다를 때 여기서 조정)
  extra_body: {}

subtitles:
  enabled: true
  # 자막 글꼴 — Windows 는 'Malgun Gothic', Mac 은 'Apple SD Gothic Neo'
  font: Malgun Gothic
  font_size: 16
  margin_v: 60              # 아래에서 띄울 거리 (쇼츠 UI에 가리지 않게)

music:
  # 따로 깔 배경음악 파일 경로 (비우면 Pika 가 만든 음악/효과음만 사용)
  bgm_path: ""
  bgm_volume: 0.15

youtube:
  privacy: private          # private 로 올리고 직접 확인한 뒤 공개하는 걸 권장합니다
  category_id: "27"         # 27 = 교육, 22 = 인물/블로그, 24 = 엔터테인먼트
  made_for_kids: false
  client_secret_file: client_secret.json
