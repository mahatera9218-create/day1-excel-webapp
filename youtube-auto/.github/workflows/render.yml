name: 영상 만들기

# GitHub 앱/웹에서 "Run workflow" 버튼을 누르면 실행됩니다.
# (대본은 미리 Claude로 작성해 커밋 + 승인해 두어야 합니다.)
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "채널 이름 (예: world, yadam)"
        required: true
        default: "world"
  # 주 3회 자동 실행 (월·수·금 10:00 UTC = 한국 19:00). 승인된 편만 올라갑니다.
  # 주의: 예약 실행은 '기본 브랜치(main)'에 이 파일이 있어야 작동합니다.
  schedule:
    - cron: "0 10 * * 1,3,5"

concurrency:
  group: render-${{ github.event.inputs.channel || 'all' }}
  cancel-in-progress: false

env:
  CHANNEL: ${{ github.event.inputs.channel || 'world' }}

jobs:
  render:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: youtube-auto
    steps:
      - uses: actions/checkout@v4

      - name: ffmpeg 설치
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 비밀 키 준비
        env:
          PIKA_API_KEY: ${{ secrets.PIKA_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
        run: |
          printf 'PIKA_API_KEY=%s\nELEVENLABS_API_KEY=%s\n' "$PIKA_API_KEY" "$ELEVENLABS_API_KEY" > .env
          if [ -n "$YOUTUBE_TOKEN_JSON" ]; then printf '%s' "$YOUTUBE_TOKEN_JSON" > "channels/$CHANNEL/token.json"; fi
          if [ -n "$CLIENT_SECRET_JSON" ]; then printf '%s' "$CLIENT_SECRET_JSON" > "channels/$CHANNEL/client_secret.json"; fi

      - name: 영상 생성 + 업로드
        run: python -m autotube render "$CHANNEL" --yes

      - name: 결과물 보관 (final.mp4 / 썸네일 / 쇼츠)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ env.CHANNEL }}
          path: |
            youtube-auto/episodes/${{ env.CHANNEL }}/**/final.mp4
            youtube-auto/episodes/${{ env.CHANNEL }}/**/thumbnail.jpg
            youtube-auto/episodes/${{ env.CHANNEL }}/**/shorts/*.mp4
          if-no-files-found: ignore
          retention-days: 7
