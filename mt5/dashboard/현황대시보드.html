<title>인걸핑 현황판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface2:#e7ecf2; --inset:#f3f6f9;
  --ink:#141b26; --muted:#5c6672; --faint:#8a94a1; --line:#d8dfe8;
  --accent:#0e8f86;
  --up:#0c7a5b; --up-bg:#dff3ec;
  --down:#c23b52; --down-bg:#fbe4e8;
  --flat:#8a7a1f; --flat-bg:#f5efd6;
  --shadow:0 1px 2px rgba(20,27,38,.06), 0 3px 10px rgba(20,27,38,.05);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1016; --surface:#151a21; --surface2:#1c232c; --inset:#11161d;
  --ink:#e7edf4; --muted:#93a0af; --faint:#68727f; --line:#2a313b;
  --accent:#2fd4c2;
  --up:#3fd6a3; --up-bg:#0f2b23;
  --down:#f4788a; --down-bg:#31161d;
  --flat:#e2bd52; --flat-bg:#2c2712;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --bg:#0d1016; --surface:#151a21; --surface2:#1c232c; --inset:#11161d;
  --ink:#e7edf4; --muted:#93a0af; --faint:#68727f; --line:#2a313b;
  --accent:#2fd4c2;
  --up:#3fd6a3; --up-bg:#0f2b23;
  --down:#f4788a; --down-bg:#31161d;
  --flat:#e2bd52; --flat-bg:#2c2712;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:14px;line-height:1.45;margin:0;padding:0 14px 40px;-webkit-text-size-adjust:100%}
.wrap{max-width:820px;margin:0 auto}
h1,h2,h3{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ── top bar ── */
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);
  padding:12px 0 10px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tb-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sym{font-size:20px;font-weight:700;letter-spacing:.02em}
.sess{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;
  background:var(--surface2);color:var(--ink)}
.price{font-family:var(--mono);font-size:26px;font-weight:600;margin-left:auto;letter-spacing:-.01em}
.tb-sub{display:flex;align-items:center;gap:8px;margin-top:6px;color:var(--muted);font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);display:inline-block}
.dot.live{background:var(--up)}
.dot.sample{background:var(--flat)}
.gear{margin-left:auto;background:none;border:1px solid var(--line);color:var(--muted);
  border-radius:8px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer}
.gear:hover{color:var(--ink);border-color:var(--muted)}

.banner{background:var(--flat-bg);color:var(--flat);border:1px solid transparent;
  border-radius:10px;padding:8px 12px;font-size:12.5px;font-weight:500;margin-bottom:14px}

/* ── section ── */
.sec-h{display:flex;align-items:center;gap:8px;margin:18px 2px 10px}
.sec-h .n{font-family:var(--mono);font-size:12px;font-weight:600;color:#fff;
  background:var(--accent);border-radius:6px;padding:1px 7px}
.sec-h h2{font-size:15px;font-weight:700;letter-spacing:.01em}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(max-width:560px){.grid{grid-template-columns:1fr}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:13px 14px;box-shadow:var(--shadow)}
.card.wide{grid-column:1/-1}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.card-h .t{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.pill.tr{background:var(--up-bg);color:var(--up)}
.pill.rg{background:var(--flat-bg);color:var(--flat)}

/* big directional number */
.big{display:flex;align-items:baseline;gap:8px}
.big .v{font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:-.01em}
.big .u{font-size:12px;color:var(--muted);font-weight:500}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}

.rows{display:flex;flex-direction:column;gap:5px;margin-top:9px}
.r{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px}
.r .k{color:var(--muted)}
.r .val{font-family:var(--mono);font-weight:500}

/* meter (diverging around center) */
.meter{margin-top:10px}
.meter .lab{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-bottom:3px}
.track{position:relative;height:8px;background:var(--inset);border-radius:999px;overflow:hidden}
.track .mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line)}
.fill{position:absolute;top:0;bottom:0;border-radius:999px}
.fill.up{background:var(--up)} .fill.down{background:var(--down)}
.meter .cap{display:flex;justify-content:space-between;font-size:11px;margin-top:4px}
.meter .cap .r{color:var(--muted)}

/* tickvol small bar */
.tv{margin-top:9px}
.tv .bar{height:6px;background:var(--inset);border-radius:999px;overflow:hidden;margin-top:3px}
.tv .bar > i{display:block;height:100%;background:var(--accent);border-radius:999px}

/* flow compare (완성 vs 진행) */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
@media(max-width:440px){.cmp{grid-template-columns:1fr}}
.cmp .col{background:var(--inset);border-radius:10px;padding:10px}
.cmp .col .h{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em}

.note{color:var(--faint);font-size:11.5px;margin-top:16px;text-align:center;line-height:1.6}

/* settings sheet */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);
  padding:0;max-width:420px;width:calc(100% - 32px);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.sheet{padding:18px}
.sheet h3{font-size:15px;margin-bottom:4px}
.sheet p{color:var(--muted);font-size:12.5px;margin:0 0 14px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field input{font:inherit;font-family:var(--mono);font-size:13px;padding:9px 10px;border-radius:9px;
  border:1px solid var(--line);background:var(--inset);color:var(--ink)}
.field input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.sheet-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.btn{font:inherit;font-weight:600;font-size:13px;padding:8px 15px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:var(--surface2);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <div class="topbar">
    <div class="tb-row">
      <span class="sym" id="sym">EURUSD</span>
      <span class="sess" id="sess">런던전반</span>
      <span class="price mono" id="price">1.08540</span>
    </div>
    <div class="tb-sub">
      <span class="dot" id="dot"></span>
      <span id="status">—</span>
      <button class="gear" id="gear">⚙ 연결 설정</button>
    </div>
  </div>

  <div class="banner" id="banner">샘플 데이터입니다 · ‘연결 설정’에서 데이터 주소를 넣으면 실시간으로 바뀝니다</div>

  <!-- (1) 방향강도 -->
  <div class="sec-h"><span class="n">1</span><h2>방향강도 터미널</h2></div>
  <div class="grid" id="dirGrid"></div>

  <!-- (2) 체결 -->
  <div class="sec-h"><span class="n">2</span><h2>체결 터미널</h2></div>
  <div id="flowWrap"></div>

  <p class="note">부호 +상승 / −하락, 절댓값이 클수록 강함 · 진입 판단은 캔들(인걸핑)에서.<br>
     이 화면은 ‘판단 재료’이며 자동매매가 아닙니다.</p>
</div>

<dialog id="cfg">
  <form method="dialog" class="sheet">
    <h3>실시간 연결 설정</h3>
    <p>EA가 현황을 올리는 데이터 주소(URL)를 넣으세요. 비워두면 샘플로 표시됩니다.</p>
    <div class="field">
      <label for="url">데이터 주소 (Pantry 등 JSON URL)</label>
      <input id="url" placeholder="https://getpantry.cloud/apiv1/pantry/…/basket/eurusd" inputmode="url">
    </div>
    <div class="field">
      <label for="ivl">갱신 주기(초)</label>
      <input id="ivl" type="number" min="10" step="5" value="30">
    </div>
    <div class="sheet-actions">
      <button class="btn" value="cancel">취소</button>
      <button class="btn primary" id="save" value="default">저장</button>
    </div>
  </form>
</dialog>

<script>
"use strict";
const $ = s => document.querySelector(s);
const LS = { url:"engulf_dash_url", ivl:"engulf_dash_ivl" };

/* ---------- 샘플 데이터 (실제 JSON 스키마와 동일) ---------- */
const SAMPLE = {
  sym:"EURUSD", kst:"09-08 17:04", session:"런던전반", price:1.08540, sample:true,
  dir:{
    session:{name:"런던전반",open:1.08500,chgpct:0.04,range_pt:25,oc_pt:4.0,strength:16,phase:"추세",
             tickvol_pct:88, reach_mid:36, reach_full:18, up:1.08610, dn:1.08390},
    daily:{open:1.08600,chgpct:-0.06,range_pt:42,oc_pt:-6.0,strength:-14,avg:38,phase:"횡보",
           tickvol_pct:63, up:1.09010, dn:1.08190, reach:-15},
    weekly:{open:1.08200,chgpct:0.31,range_pt:120,oc_pt:34.0,strength:28,avg:22,phase:"추세",
            tickvol_pct:71, up:1.09400, dn:1.07000, reach:47},
    h4:{done:32,avg:40,phase:"횡보",now:12,elapsed_pct:33,h1pos:41}
  },
  flow:{ flag:"제공",
    h4:{valid:true,total:1234,distort:12,dom:8.0,up:640,down:560,net_pip:12,span_pip:34},
    entry:{tf:"M5",
      done:{total:120,dom:8.0,up:64,down:56,move:1.2,swing:3.4,eff:0.35},
      now:{total:33,dom:-6.0,up:14,down:19,move:-0.4,swing:1.1,eff:0.36,elapsed_pct:40}},
    zone:{tf:"H1",
      done:{total:820,dom:15.0,up:471,down:349,move:6.0,swing:14.0,eff:0.43},
      now:{total:210,dom:4.0,up:109,down:101,move:1.8,swing:6.2,eff:0.29,elapsed_pct:55}}
  }
};

/* ---------- helpers ---------- */
const cls = v => v>0?"up":(v<0?"down":"flat");
const arw = v => v>0?"▲":(v<0?"▼":"—");
const sgn = (v,d=1)=> (v>0?"+":"")+ (v==null?"–":Number(v).toFixed(d));
const f = (v,d=1)=> v==null?"–":Number(v).toFixed(d);

function meter(reach){            // diverging: 시가=중앙, ±100%=레벨
  const r = Math.max(-150, Math.min(150, reach||0));
  const half = Math.min(50, Math.abs(r)/150*50);
  const side = r>=0 ? `left:50%;width:${half}%` : `right:50%;width:${half}%`;
  const c = r>=0?"up":"down";
  return `<div class="track"><div class="mid"></div><div class="fill ${c}" style="${side}"></div></div>`;
}

function dirCard(t, d, opts={}){
  const st = d.strength;
  const phase = d.phase==="추세"?`<span class="pill tr">추세</span>`:`<span class="pill rg">횡보</span>`;
  let lvlBlock = "";
  if(opts.session){
    lvlBlock = `
      <div class="meter">
        <div class="lab"><span>하단 ${f(d.dn,5)}</span><span>상단 ${f(d.up,5)}</span></div>
        ${meter(d.reach_full)}
        <div class="cap"><span class="r">최종레벨 도달</span><span class="mono">${f(d.reach_full,0)}%</span></div>
      </div>`;
  } else if(d.reach!=null){
    lvlBlock = `
      <div class="meter">
        <div class="lab"><span>하단 ${f(d.dn,5)}</span><span>상단 ${f(d.up,5)}</span></div>
        ${meter(d.reach)}
        <div class="cap"><span class="r">레벨 도달</span><span class="mono">${f(d.reach,0)}%</span></div>
      </div>`;
  }
  const avgRow = d.avg!=null?`<div class="r"><span class="k">평균 대비</span><span class="val">${f(Math.abs(st),0)} / ${f(d.avg,0)}</span></div>`:"";
  const tv = d.tickvol_pct!=null?`
    <div class="tv"><div class="r"><span class="k">틱볼륨</span><span class="val">${f(d.tickvol_pct,0)}%</span></div>
      <div class="bar"><i style="width:${Math.min(100,d.tickvol_pct)}%"></i></div></div>`:"";
  return `<div class="card">
    <div class="card-h"><span class="t">${t}</span>${phase}</div>
    <div class="big"><span class="v ${cls(st)}">${arw(st)} ${sgn(st,0)}<span class="u">%</span></span></div>
    <div class="rows">
      <div class="r"><span class="k">시가대비</span><span class="val ${cls(d.chgpct)}">${sgn(d.chgpct,2)}%</span></div>
      <div class="r"><span class="k">고저 / 시종</span><span class="val">${f(d.range_pt,0)}pt / ${sgn(d.oc_pt,0)}pt</span></div>
      ${avgRow}
    </div>
    ${lvlBlock}${tv}
  </div>`;
}

function h4Card(h4){
  const phase = h4.phase==="추세"?`<span class="pill tr">추세</span>`:`<span class="pill rg">횡보</span>`;
  return `<div class="card">
    <div class="card-h"><span class="t">H4 국면 (전략)</span>${phase}</div>
    <div class="big"><span class="v ${cls(h4.done)}">${arw(h4.done)} ${sgn(h4.done,0)}<span class="u">% 완성</span></span></div>
    <div class="rows">
      <div class="r"><span class="k">완성 평균 대비</span><span class="val">${f(Math.abs(h4.done),0)} / ${f(h4.avg,0)}</span></div>
      <div class="r"><span class="k">진행 방향강도</span><span class="val ${cls(h4.now)}">${sgn(h4.now,0)}% · 경과 ${f(h4.elapsed_pct,0)}%</span></div>
      <div class="r"><span class="k">H1 위치(5일범위)</span><span class="val">${f(h4.h1pos,0)}%</span></div>
    </div>
    <div class="tv"><div class="bar"><i style="width:${Math.min(100,h4.h1pos)}%"></i></div></div>
  </div>`;
}

function domMeter(dom){
  const r = Math.max(-100,Math.min(100,dom||0));
  const half = Math.abs(r)/100*50;
  const side = r>=0?`left:50%;width:${half}%`:`right:50%;width:${half}%`;
  const c = r>=0?"up":"down";
  return `<div class="track"><div class="mid"></div><div class="fill ${c}" style="${side}"></div></div>`;
}
function flowCol(h, o){
  if(!o) return `<div class="col"><div class="h">${h}</div><div class="r"><span class="k">데이터 없음</span></div></div>`;
  return `<div class="col"><div class="h">${h}${o.elapsed_pct!=null?` · ${f(o.elapsed_pct,0)}%`:""}</div>
    <div class="meter" style="margin-top:2px">
      <div class="lab"><span>매도</span><span>매수</span></div>
      ${domMeter(o.dom)}
      <div class="cap"><span class="r">체결 우위</span><span class="mono ${cls(o.dom)}">${sgn(o.dom,0)}%</span></div>
    </div>
    <div class="rows" style="margin-top:8px">
      <div class="r"><span class="k">총틱 (↑/↓)</span><span class="val">${o.total} <span class="up">${o.up}</span>/<span class="down">${o.down}</span></span></div>
      <div class="r"><span class="k">실이동 / 흔들림</span><span class="val ${cls(o.move)}">${sgn(o.move,1)} / ${f(o.swing,1)}</span></div>
      <div class="r"><span class="k">효율</span><span class="val">${f(o.eff,2)}</span></div>
    </div></div>`;
}

function render(d){
  $("#sym").textContent = d.sym||"—";
  $("#sess").textContent = d.session||"—";
  $("#price").textContent = d.price!=null?Number(d.price).toFixed(5):"—";

  const g = $("#dirGrid");
  g.innerHTML = dirCard("실시간 세션", d.dir.session, {session:true})
    + dirCard("당일 일간", d.dir.daily)
    + dirCard("이번주 주간", d.dir.weekly)
    + h4Card(d.dir.h4);

  const fl = d.flow;
  const fw = $("#flowWrap");
  const h4 = fl.h4;
  fw.innerHTML = `
    <div class="card wide">
      <div class="card-h"><span class="t">최근 4H 체결 요약</span>
        <span class="pill ${fl.flag==='제공'?'tr':'rg'}">flag ${fl.flag}</span></div>
      ${ h4 && h4.valid ? `
      <div class="meter">
        <div class="lab"><span>매도</span><span>매수</span></div>${domMeter(h4.dom)}
        <div class="cap"><span class="r">순 방향성 (↑${h4.up}/↓${h4.down})</span><span class="mono ${cls(h4.dom)}">${sgn(h4.dom,1)}%</span></div>
      </div>
      <div class="rows" style="margin-top:9px">
        <div class="r"><span class="k">누적틱 (왜곡)</span><span class="val">${h4.total} (${h4.distort})</span></div>
        <div class="r"><span class="k">순이동 / 고저폭</span><span class="val ${cls(h4.net_pip)}">${sgn(h4.net_pip,0)}핍 / ${f(h4.span_pip,0)}핍</span></div>
      </div>` : `<div class="r"><span class="k">틱 데이터 없음 (휴장/보관량)</span></div>` }
    </div>
    <div class="card wide" style="margin-top:12px">
      <div class="card-h"><span class="t">${fl.entry.tf} 진입 프레임 · 완성 vs 진행</span></div>
      <div class="cmp">${flowCol("직전 완성봉", fl.entry.done)}${flowCol("현재 진행봉", fl.entry.now)}</div>
    </div>
    <div class="card wide" style="margin-top:12px">
      <div class="card-h"><span class="t">${fl.zone.tf} 자리 프레임 · 완성 vs 진행</span></div>
      <div class="cmp">${flowCol("직전 완성봉", fl.zone.done)}${flowCol("현재 진행봉", fl.zone.now)}</div>
    </div>`;
}

/* ---------- live fetch ---------- */
let timer=null;
function setStatus(kind,msg){
  $("#dot").className = "dot "+(kind||"");
  $("#status").textContent = msg;
  $("#banner").style.display = kind==="live" ? "none" : "block";
}
async function tick(){
  const url = localStorage.getItem(LS.url);
  if(!url){ render(SAMPLE); setStatus("sample","샘플 데이터"); return; }
  try{
    const res = await fetch(url, {cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    let data = await res.json();
    if(data && data.payload) data = data.payload;         // pantry 래핑 대응
    render(data);
    const t = new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    setStatus("live", "실시간 · "+t+" 갱신"+(data.kst?" (봉 "+data.kst+")":""));
  }catch(err){
    render(SAMPLE);
    setStatus("sample","연결 실패 — 샘플 표시 ("+err.message+")");
  }
}
function loop(){
  if(timer) clearInterval(timer);
  const ivl = Math.max(10, parseInt(localStorage.getItem(LS.ivl)||"30",10))*1000;
  tick();
  if(localStorage.getItem(LS.url)) timer=setInterval(tick, ivl);
}

/* ---------- settings ---------- */
const dlg = $("#cfg");
$("#gear").onclick = ()=>{
  $("#url").value = localStorage.getItem(LS.url)||"";
  $("#ivl").value = localStorage.getItem(LS.ivl)||"30";
  dlg.showModal();
};
$("#save").addEventListener("click", ()=>{
  const u = $("#url").value.trim();
  const v = $("#ivl").value.trim()||"30";
  if(u) localStorage.setItem(LS.url,u); else localStorage.removeItem(LS.url);
  localStorage.setItem(LS.ivl,v);
  setTimeout(loop, 30);
});

try{ loop(); }catch(e){ render(SAMPLE); setStatus("sample","샘플 데이터"); }
