name: 캐릭터 생성 (게임용)

# game/prompts.json 또는 gen_cast.py 가 push 되면 기존 Pika 키로 캐릭터를 생성해 game/cast/ 에 커밋한다.
on:
  push:
    branches: [main]
    paths:
      - "game/prompts.json"
      - "game/gen_cast.py"

permissions:
  contents: write

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 캐릭터 생성
        env:
          PIKA_API_KEY: ${{ secrets.PIKA_API_KEY }}
        run: python game/gen_cast.py
      - name: 커밋 (생성 이미지)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f game/cast/*.png 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "커밋할 이미지 없음"
          else
            git commit -m "gen cast: 캐릭터 이미지 [skip ci]"
            git pull --rebase origin main || true
            for i in 1 2 3 4; do git push origin HEAD:main && break || sleep $((2**i)); done
          fi
      - name: 아티팩트 보관(백업)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cast
          path: game/cast/*.png
          if-no-files-found: ignore
          retention-days: 7
