name: 배경 제거 (투명 컷아웃)

# game/cut_bg.py 가 push 되면 rembg(AI)로 캐릭터 배경을 제거해 game/cut/ 에 커밋한다.
on:
  push:
    branches: [main]
    paths:
      - "game/cut_bg.py"

permissions:
  contents: write

jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "rembg[cpu]" pillow onnxruntime
      - name: 배경 제거
        run: python game/cut_bg.py
      - name: 커밋 (투명 컷아웃)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f game/cut/*.png 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "커밋할 컷아웃 없음"
          else
            git commit -m "cut bg: 투명 컷아웃 [skip ci]"
            git pull --rebase origin main || true
            for i in 1 2 3 4; do git push origin HEAD:main && break || sleep $((2**i)); done
          fi
