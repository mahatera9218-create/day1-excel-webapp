name: 영상 만들기

# GitHub 앱/웹에서 "Run workflow" 버튼을 누르면 실행됩니다.
# (대본은 미리 Claude로 작성해 커밋 + 승인해 두어야 합니다.)
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "채널 이름 (예: world, yadam)"
        required: true
        default: "world"
      episode:
        description: "특정 편 폴더명 (비우면 아직 안 만든 가장 오래된 승인 편)"
        required: false
        default: ""
  # 매일 자동으로 2편 생성 (10:17 UTC = 한국 19:17). 업로드 키트에 올라옴.
  # 올린 편을 '목록에서 제거'(status.json 삭제)하지 않으면 다음날 또 만들어지니 주의.
  schedule:
    - cron: "17 10 * * *"      # 매일 19:17 KST: 2편 생성
    - cron: "40 14 * * 0"      # 일요일 23:40 KST: 그날 작성된 대본으로 첫 2편 바로 생성

concurrency:
  group: render-${{ github.event.inputs.channel || 'all' }}
  cancel-in-progress: false

env:
  CHANNEL: ${{ github.event.inputs.channel || 'world' }}

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: youtube-auto
    steps:
      - uses: actions/checkout@v4

      - name: ffmpeg 설치
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 비밀 키 준비
        env:
          PIKA_API_KEY: ${{ secrets.PIKA_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
        run: |
          printf 'PIKA_API_KEY=%s\nELEVENLABS_API_KEY=%s\n' "$PIKA_API_KEY" "$ELEVENLABS_API_KEY" > .env
          if [ -n "$YOUTUBE_TOKEN_JSON" ]; then printf '%s' "$YOUTUBE_TOKEN_JSON" > "channels/$CHANNEL/token.json"; fi
          if [ -n "$CLIENT_SECRET_JSON" ]; then printf '%s' "$CLIENT_SECRET_JSON" > "channels/$CHANNEL/client_secret.json"; fi

      - name: 영상 생성 (하루 2편, 또는 지정 편)
        env:
          EPISODE: ${{ github.event.inputs.episode }}
        run: |
          if [ -n "$EPISODE" ]; then
            python -m autotube render "$CHANNEL" --yes --episode "$EPISODE"
          else
            python -m autotube render "$CHANNEL" --yes --count 2
          fi

      - name: 업로드 키트 페이지 빌드
        if: success()
        run: |
          python3 -m autotube.build_preview "episodes/$CHANNEL" "$GITHUB_WORKSPACE/site" \
            "$CHANNEL" "$GITHUB_REPOSITORY" "main" "youtube-auto/episodes/$CHANNEL"

      - name: Pages 설정
        if: success()
        uses: actions/configure-pages@v5

      - name: 미리보기를 Pages 아티팩트로 업로드
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: GitHub Pages 배포
        id: deployment
        if: success()
        uses: actions/deploy-pages@v4

      - name: 결과물 보관 (final.mp4 / 썸네일 / 쇼츠)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ env.CHANNEL }}
          path: |
            youtube-auto/episodes/${{ env.CHANNEL }}/**/final.mp4
            youtube-auto/episodes/${{ env.CHANNEL }}/**/thumbnail.jpg
            youtube-auto/episodes/${{ env.CHANNEL }}/**/shorts/*.mp4
          if-no-files-found: ignore
          retention-days: 7
