name: 영상 만들기

# GitHub 앱/웹에서 "Run workflow" 버튼을 누르면 실행됩니다.
# (대본은 미리 Claude로 작성해 커밋 + 승인해 두어야 합니다.)
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "채널 이름 (예: world, yadam)"
        required: true
        default: "world"
      episode:
        description: "특정 편 폴더명 (비우면 아직 안 만든 가장 오래된 승인 편)"
        required: false
        default: ""
      upload:
        description: "유튜브 자동 업로드 (기본 true=비공개 업로드; false=렌더만)"
        required: false
        default: "true"
  # ★ 주 트리거: 검수가 끝나면 youtube-auto/.render-queue 에 한 줄 추가·push → '즉시' 렌더.
  # (GitHub schedule 은 자주 지연·누락돼서 믿을 수 없다. push 이벤트는 바로 뜬다.)
  push:
    branches: [main]
    paths:
      - "youtube-auto/episodes/world/**"   # 드래퍼/검수가 새 에피소드를 push하면 즉시 렌더
      - "youtube-auto/.render-queue"        # 수동으로 렌더를 걸고 싶을 때 이 파일에 한 줄 추가·push
  # 백업 스케줄 (push 를 놓쳤을 때 대비). 03:50 UTC ≈ 한국 12:50.
  schedule:
    - cron: "50 3 * * *"      # 백업: 승인된 2편 렌더 + 유튜브 비공개 업로드

concurrency:
  group: render-${{ github.event.inputs.channel || 'all' }}
  cancel-in-progress: false

env:
  CHANNEL: ${{ github.event.inputs.channel || 'world' }}

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: youtube-auto
    steps:
      - uses: actions/checkout@v4

      - name: ffmpeg 설치
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 비밀 키 준비
        env:
          PIKA_API_KEY: ${{ secrets.PIKA_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
        run: |
          printf 'PIKA_API_KEY=%s\nELEVENLABS_API_KEY=%s\n' "$PIKA_API_KEY" "$ELEVENLABS_API_KEY" > .env
          if [ -n "$YOUTUBE_TOKEN_JSON" ]; then printf '%s' "$YOUTUBE_TOKEN_JSON" > "channels/$CHANNEL/token.json"; fi
          if [ -n "$CLIENT_SECRET_JSON" ]; then printf '%s' "$CLIENT_SECRET_JSON" > "channels/$CHANNEL/client_secret.json"; fi

      - name: 영상 생성 (하루 2편, 또는 지정 편)
        env:
          EPISODE: ${{ github.event.inputs.episode }}
          UPLOAD: ${{ github.event.inputs.upload }}
        run: |
          NOUP=""
          if [ "$UPLOAD" = "false" ]; then NOUP="--no-upload"; fi   # 기본은 자동 업로드(스케줄 포함); false면 렌더만
          EPISODE="$(printf '%s' "$EPISODE" | xargs)"   # 복붙 시 앞뒤 공백 제거(입력 실수 방지)
          # .render-queue 해석 (날짜/주석 줄은 폴더가 아니라 무시됨 — 하위호환):
          #   'thumb: <폴더>'  -> 그 편 '썸네일만' 교체(재렌더 X, 거의 공짜)
          #   '<폴더>'         -> 그 편 전체 재렌더+업로드(--episode = 중복검사 우회)
          THUMB=""; RERUN=""
          while IFS= read -r raw; do
            line="$(printf '%s' "$raw" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            case "$line" in
              ''|\#*) ;;
              thumb:*) ep="$(printf '%s' "${line#thumb:}" | xargs)"; [ -d "episodes/$CHANNEL/$ep" ] && THUMB="$THUMB $ep" ;;
              *) ep="$(printf '%s' "$line" | awk '{print $1}')"; [ -d "episodes/$CHANNEL/$ep" ] && RERUN="$RERUN $ep" ;;
            esac
          done < .render-queue
          if [ -n "$EPISODE" ]; then
            python -m autotube render "$CHANNEL" --yes --episode "$EPISODE" $NOUP
          elif [ -n "$THUMB$RERUN" ]; then
            for ep in $THUMB; do echo "[thumb] $ep"; python -m autotube thumb "$CHANNEL" --episode "$ep"; done
            for ep in $RERUN; do echo "[rerender] $ep"; python -m autotube render "$CHANNEL" --yes --episode "$ep"; done
          else
            python -m autotube render "$CHANNEL" --yes --count 2 $NOUP
          fi

      - name: 업로드 표식 커밋 (중복 업로드 방지)
        if: success()
        run: |
          # 업로드가 끝나면 youtube_id.txt(= '이미 올림' 표식)와 status.json 을 main 에 되돌려 커밋한다.
          # 이게 없으면 다음 실행이 깨끗한 체크아웃에서 같은 편을 또 렌더·업로드해 중복이 난다.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 큐에 '에피소드' 줄(thumb: 포함)이 있었으면 처리됐으니 큐를 비운다(다음 push 때 또 안 돌게).
          CLEARQ=""
          while IFS= read -r raw; do
            line="$(printf '%s' "$raw" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            case "$line" in ''|\#*) ep="" ;; thumb:*) ep="$(printf '%s' "${line#thumb:}" | xargs)" ;; *) ep="$(printf '%s' "$line" | awk '{print $1}')" ;; esac
            [ -n "$ep" ] && [ -d "episodes/$CHANNEL/$ep" ] && CLEARQ=1
          done < .render-queue
          if [ -n "$CLEARQ" ]; then
            printf '# 큐: 폴더명 줄 = 전체 재렌더, "thumb: 폴더명" 줄 = 썸네일만 교체. push 하면 처리 후 자동 비움.\n' > .render-queue
            git add .render-queue
          fi
          git add "episodes/$CHANNEL" 2>/dev/null || true   # mp4/png 등 결과물은 .gitignore 처리됨
          if git diff --cached --quiet; then
            echo "커밋할 표식 없음 (렌더만 했거나 변화 없음)."
          else
            git commit -m "render: 업로드 완료 편 표식 커밋 [skip ci]"
            git pull --rebase origin main || true
            for i in 1 2 3 4; do git push origin HEAD:main && break || sleep $((2**i)); done
          fi

      - name: 업로드 키트 페이지 빌드
        if: success()
        run: |
          python3 -m autotube.build_preview "episodes/$CHANNEL" "$GITHUB_WORKSPACE/site" \
            "$CHANNEL" "$GITHUB_REPOSITORY" "main" "youtube-auto/episodes/$CHANNEL"

      - name: Pages 설정
        if: success()
        uses: actions/configure-pages@v5

      - name: 미리보기를 Pages 아티팩트로 업로드
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: GitHub Pages 배포
        id: deployment
        if: success()
        uses: actions/deploy-pages@v4

      - name: 결과물 보관 (final.mp4 / 썸네일 / 쇼츠)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ env.CHANNEL }}
          path: |
            youtube-auto/episodes/${{ env.CHANNEL }}/**/final.mp4
            youtube-auto/episodes/${{ env.CHANNEL }}/**/thumbnail.jpg
            youtube-auto/episodes/${{ env.CHANNEL }}/**/shorts/*.mp4
          if-no-files-found: ignore
          retention-days: 7
