<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#05070a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PIPxLOT">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>PIPxLOT 현황판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#05070a; --surface:#0a0e13; --surface2:#10151d; --inset:#0c1015; --panel2:#0e131a;
  --ink:#e4e8ee; --muted:#8b939f; --faint:#545c67; --line:#1b222d; --grid:#161c25;
  --accent:#ffab2e; --accent2:#46b8e6;
  --up:#ffffff; --up-bg:rgba(255,255,255,.085); --up-dim:#c9ced6;
  --down:#79828e; --down-bg:rgba(121,130,142,.14);
  --flat:#ffab2e; --flat-bg:rgba(255,171,46,.12);
  --sans:"IBM Plex Sans KR","IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13.5px;line-height:1.45;margin:0;padding:0 11px 46px;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--flat)}
small{font-size:.82em;color:var(--faint)}

/* header — terminal command line */
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 18px) 2px 10px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.tb-row{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.sym{font-family:var(--mono);font-size:16px;font-weight:700;letter-spacing:.06em;color:var(--accent)}
.sess{font-size:10.5px;font-weight:600;padding:2px 8px;border:1px solid var(--line);border-radius:3px;background:var(--surface2);color:var(--muted);letter-spacing:.02em}
.price{font-family:var(--mono);font-size:22px;font-weight:600;margin-left:auto;letter-spacing:0}
.tb-sub{display:flex;align-items:center;gap:7px;margin-top:6px;color:var(--muted);font-size:10.5px;flex-wrap:wrap;font-family:var(--mono);letter-spacing:.02em}
.dot{width:7px;height:7px;border-radius:1px;background:var(--faint);display:inline-block}
.dot.live{background:var(--up);animation:blink 1.6s step-end infinite}
.dot.sample{background:var(--flat)}
@keyframes blink{50%{opacity:.35}}
.gear{margin-left:auto;background:var(--surface2);border:1px solid var(--line);color:var(--muted);border-radius:4px;padding:4px 10px;font:inherit;font-family:var(--mono);font-size:10.5px;font-weight:600;cursor:pointer;letter-spacing:.03em}

/* 판정 hero — status readout */
.hero{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;background:linear-gradient(180deg,var(--surface),var(--bg));padding:13px 14px;margin-bottom:14px}
.hero.up{border-left-color:var(--up)}.hero.down{border-left-color:var(--down)}.hero.flat{border-left-color:var(--accent)}
.hero-top{display:flex;align-items:center;gap:12px;margin-bottom:11px}
.ar-badge{width:46px;height:46px;flex:none;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;border:1px solid var(--line);background:var(--surface2)}
.ar-badge.up{color:var(--up);border-color:var(--up)}
.ar-badge.down{color:var(--down);border-color:var(--down)}
.ar-badge.flat{color:var(--accent);border-color:var(--accent)}
.hero-mid{min-width:0}
.verd{font-size:23px;font-weight:700;line-height:1.05;letter-spacing:.01em;display:block}
.verd.up{color:var(--up)}.verd.down{color:var(--down)}.verd.flat{color:var(--accent)}
.binfo{font-size:10.5px;color:var(--muted);font-family:var(--mono);letter-spacing:.02em}
.algn{margin-left:auto;text-align:right;flex:none}
.pips{display:flex;gap:3px;justify-content:flex-end;margin-bottom:5px}
.pip{width:15px;height:6px;border-radius:1px;background:var(--surface2);border:1px solid var(--line)}
.pip.on{background:var(--accent);border-color:transparent}
.algn span{font-size:9.5px;color:var(--muted);letter-spacing:.06em;font-family:var(--mono);text-transform:uppercase}
.hero .guide{font-size:12px;line-height:1.55;color:var(--ink);background:var(--inset);border:1px solid var(--line);border-radius:5px;padding:9px 11px}

/* section label — command prompt */
.sec-h{display:flex;align-items:center;gap:9px;margin:20px 3px 10px}
.sec-h .n{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.05em}
.sec-h h2{font-size:11px;font-weight:700;margin:0;text-transform:uppercase;letter-spacing:.14em;color:var(--ink);font-family:var(--sans)}
.sec-h .ln{flex:1;height:1px;background:var(--line)}
.sec-h .hint{font-size:9.5px;color:var(--faint);font-family:var(--mono);letter-spacing:.03em;text-transform:uppercase}

/* 읽기 callout */
.read{display:flex;gap:9px;font-size:12px;line-height:1.55;border-radius:5px;padding:9px 11px;margin-bottom:11px;background:var(--inset);border:1px solid var(--line);border-left-width:3px}
.read.up{border-left-color:var(--up)}
.read.down{border-left-color:var(--down)}
.read.flat{border-left-color:var(--accent)}
.read .rk{font-size:9px;font-weight:700;flex:none;text-transform:uppercase;letter-spacing:.1em;padding-top:2px;font-family:var(--mono);color:var(--accent)}
.read b{font-weight:700;color:var(--ink)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 13px;margin-bottom:11px}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;border-bottom:1px solid var(--grid);padding-bottom:7px}
.card-h .t{font-size:10px;font-weight:700;color:var(--accent);letter-spacing:.1em;text-transform:uppercase;font-family:var(--mono)}
.pill{font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:3px;letter-spacing:.04em;font-family:var(--mono);border:1px solid var(--line)}
.pill.tr{background:var(--up-bg);color:var(--up-dim)}.pill.rg{background:var(--down-bg);color:var(--down)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
.card.wide{grid-column:1/-1}

/* 비교 매트릭스 — data grid */
.mtx{width:100%;border-collapse:collapse;font-family:var(--mono)}
.mtx th{font-family:var(--sans);font-size:9px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;padding:0 6px 7px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
.mtx th:first-child{text-align:left}
.mtx td{font-size:13px;font-weight:600;text-align:right;padding:8px 6px;border-bottom:1px solid var(--grid);color:var(--ink);letter-spacing:0}
.mtx tr:last-child td{border-bottom:0}
.mtx td.k{font-family:var(--sans);font-weight:600;text-align:left;white-space:nowrap;font-size:12px;color:var(--muted)}
.mtx td .sub{font-family:var(--sans);font-size:9px;font-weight:500;color:var(--faint);margin-left:4px;letter-spacing:.02em}
.mtx td.empty{color:var(--faint);font-weight:400;font-size:11px}
.legend{display:flex;align-items:center;gap:10px;justify-content:flex-start;margin-top:9px;font-size:9.5px;color:var(--faint);font-family:var(--mono);letter-spacing:.02em}

/* dir 상세 카드 */
.hdln{display:flex;align-items:baseline;gap:8px;margin:2px 0 9px}
.hdln .v{font-family:var(--mono);font-size:19px;font-weight:600;letter-spacing:0}
.hdln .avg{font-size:11px;color:var(--muted);font-family:var(--mono)}
.rows{display:flex;flex-direction:column;gap:6px}
.r{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;gap:10px}
.r .k{color:var(--muted);white-space:nowrap}
.r .val{font-family:var(--mono);font-weight:500;text-align:right}
.tv{margin-top:10px}
.tv .bar{height:4px;background:var(--inset);border:1px solid var(--grid);border-radius:0;overflow:hidden;margin-top:5px}
.tv .bar>i{display:block;height:100%;background:var(--accent);opacity:.8}
.lvl{margin-top:11px;padding-top:10px;border-top:1px solid var(--grid)}
.lvl .lh{font-size:9.5px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;font-family:var(--mono)}
.lvl .pair{display:flex;justify-content:space-between;font-size:11.5px;font-family:var(--mono);margin-bottom:6px;gap:8px}
.track{position:relative;height:6px;background:var(--inset);border:1px solid var(--grid);border-radius:0;overflow:hidden}
.track .mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--faint);opacity:.6}
.fill{position:absolute;top:0;bottom:0}
.fill.up{background:var(--up)}.fill.down{background:var(--down)}
.cap{display:flex;justify-content:space-between;font-size:10px;margin-top:5px;color:var(--muted);font-family:var(--mono)}
.cap .rt{font-weight:600}

/* 자리 레벨 축 그래프 */
.axis-wrap{display:flex;gap:12px;align-items:center}
.axis-wrap svg{flex:none}
.axis-side{flex:1;display:flex;flex-direction:column;gap:9px;min-width:0}
.lgrow{display:flex;align-items:center;gap:8px;font-size:11px;font-family:var(--mono)}
.lgrow .dot2{width:10px;height:3px;flex:none}
.lgrow .nm{color:var(--muted);font-weight:600;width:26px;flex:none;font-family:var(--sans)}
.lgrow .rg{font-size:10px;color:var(--ink);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lgrow .rr{font-weight:700;flex:none}
.axis-note{font-size:9.5px;color:var(--faint);margin-top:10px;line-height:1.6;font-family:var(--mono)}
.rb+.rb{margin-top:11px}

/* 힘 */
.spark-wrap{margin-top:12px;border-top:1px solid var(--grid);padding-top:11px}
.spark-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.spark-h .t{font-size:9.5px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;font-family:var(--mono)}
.spark-h .c{font-size:10.5px;font-weight:600;font-family:var(--mono)}
.spark{display:flex;align-items:flex-end;gap:8px;height:46px}
.spark .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.spark .bar{width:100%;min-height:5px}
.spark .lb{font-family:var(--mono);font-size:9px;color:var(--faint)}
.sbar{border-top:1px solid var(--grid);padding-top:10px;margin-top:10px}
.sbar.first{border-top:0;margin-top:2px;padding-top:0}
.sbar-h{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.sbar-h .tag{font-family:var(--mono);font-weight:700;font-size:10px;padding:1px 7px;border-radius:3px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.sbar-h .tag.now{background:var(--accent);color:#1a1200;border-color:transparent}
.sbar-h .rng{font-size:10px;color:var(--faint);font-family:var(--mono)}
.srows{display:flex;flex-direction:column;gap:5px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
@media(max-width:480px){.cmp{grid-template-columns:1fr}}
.cmp .col{background:var(--inset);border:1px solid var(--grid);border-radius:5px;padding:11px}
.cmp .col .h{font-size:9.5px;font-weight:700;color:var(--muted);margin-bottom:7px;text-transform:uppercase;letter-spacing:.05em;font-family:var(--mono)}

.banner{background:var(--flat-bg);color:var(--accent);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:4px;padding:8px 11px;font-size:11px;font-weight:500;margin-bottom:12px;font-family:var(--mono);letter-spacing:.01em}
.dq{font-family:var(--mono);font-size:10.5px;line-height:1.5;padding:8px 11px;border-radius:4px;margin-bottom:12px;border:1px solid var(--line);border-left-width:3px;letter-spacing:.01em}
.dq.ok{color:var(--muted);border-left-color:var(--up);background:var(--inset)}
.dq.warn{color:var(--accent);border-left-color:var(--accent);background:var(--flat-bg)}
.dq.bad{color:#1a1200;border-left-color:var(--accent);background:var(--accent);font-weight:700}
.dq b{font-weight:700}
.note{color:var(--faint);font-size:10px;margin-top:16px;text-align:center;line-height:1.7;letter-spacing:.02em;font-family:var(--mono)}
dialog{border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);padding:0;max-width:420px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.sheet{padding:18px}.sheet h3{font-size:14px;margin:0 0 4px;color:var(--accent);font-family:var(--mono);letter-spacing:.03em}.sheet p{color:var(--muted);font-size:12px;margin:0 0 15px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.field label{font-size:11px;font-weight:600;color:var(--muted)}
.field input{font:inherit;font-family:var(--mono);font-size:12.5px;padding:10px 11px;border-radius:4px;border:1px solid var(--line);background:var(--inset);color:var(--ink)}
.field input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.sheet-actions{display:flex;gap:8px;justify-content:flex-end}
.btn{font:inherit;font-family:var(--mono);font-weight:600;font-size:12.5px;padding:9px 16px;border-radius:4px;cursor:pointer;border:1px solid var(--line);background:var(--surface2);color:var(--ink);letter-spacing:.02em}
.btn.primary{background:var(--accent);border-color:transparent;color:#1a1200}
details.det{margin-bottom:11px}
details.det>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--accent);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:11px 13px;letter-spacing:.03em;font-family:var(--mono);text-transform:uppercase}
details.det>summary::-webkit-details-marker{display:none}
details.det>summary .chev{margin-left:auto;color:var(--muted);transition:transform .18s}
details.det[open]>summary .chev{transform:rotate(180deg)}
details.det[open]>summary{border-radius:6px 6px 0 0}
.det-body{border:1px solid var(--line);border-top:0;border-radius:0 0 6px 6px;background:var(--panel2);padding:12px}
.det-body .grid,.det-body .card:last-child{margin-bottom:0}
/* ===== 결론 + 퍼널 + 표준카드 ===== */
.verdict{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;background:linear-gradient(180deg,var(--surface),var(--bg));padding:14px 15px;margin-bottom:6px}
.verdict.up{border-left-color:var(--up)}.verdict.down{border-left-color:var(--down)}.verdict.flat{border-left-color:var(--accent)}
.vtop{display:flex;align-items:center;gap:13px}
.vbadge{width:48px;height:48px;flex:none;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;border:1px solid var(--line);background:var(--surface2)}
.vbadge.up{border-color:var(--up);color:var(--up);background:var(--up-bg)}.vbadge.down{border-color:var(--down);color:var(--down);background:var(--down-bg)}.vbadge.flat{border-color:var(--accent);color:var(--accent);background:var(--flat-bg)}
.vmid{min-width:0}
.vmid .lab{font-size:9.5px;color:var(--faint);letter-spacing:.14em;text-transform:uppercase;font-family:var(--mono)}
.vmid .verd2{font-size:23px;font-weight:700;line-height:1.05}
.vmid .verd2.up{color:var(--up)}.vmid .verd2.down{color:var(--down)}.vmid .verd2.flat{color:var(--accent)}
.vmid .binfo{font-size:10.5px;color:var(--muted);font-family:var(--mono)}
.valn{margin-left:auto;text-align:right;flex:none}
.valn span{font-size:9.5px;color:var(--muted);letter-spacing:.05em;font-family:var(--mono);text-transform:uppercase}
.vguide{margin-top:11px;font-size:12px;line-height:1.5;color:var(--ink);background:var(--inset);border:1px solid var(--line);border-radius:5px;padding:9px 11px}
.because{display:flex;align-items:center;gap:8px;margin:12px 2px 10px;color:var(--faint);font-size:10px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase}
.because .ln{flex:1;height:1px;background:var(--line)}
.funnel{position:relative}
.funnel::before{content:"";position:absolute;left:14px;top:16px;bottom:24px;width:2px;background:var(--line)}
.step{position:relative;display:flex;gap:12px;margin-bottom:12px}
.step .num{width:30px;height:30px;flex:none;border-radius:50%;background:var(--surface);border:2px solid var(--accent);color:var(--accent);font-family:var(--mono);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;z-index:1;margin-top:2px}
.step .body{flex:1;min-width:0}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.chead{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--grid)}
.chead .t{font-size:12px;font-weight:700;letter-spacing:.02em}
.chead .sub{font-size:10px;color:var(--faint);font-family:var(--mono)}
.chead .st{margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:700;padding:2px 8px;border-radius:3px;border:1px solid var(--line)}
.st.up{color:var(--up);background:var(--up-bg)}.st.down{color:var(--down);background:var(--down-bg)}.st.flat{color:var(--accent);background:var(--flat-bg)}
.cread{display:flex;gap:8px;font-size:12px;line-height:1.5;padding:9px 12px;background:var(--inset)}
.cread .rk{font-size:9px;font-weight:700;flex:none;text-transform:uppercase;letter-spacing:.1em;padding-top:2px;font-family:var(--mono);color:var(--accent)}
.cread b{font-weight:700;color:var(--ink)}
.cviz{padding:11px 12px}
.cstats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--grid)}
.cstats .s{padding:9px 10px;border-right:1px solid var(--grid)}
.cstats .s:last-child{border-right:0}
.cstats .sk{font-size:9px;color:var(--faint);text-transform:uppercase;letter-spacing:.03em;margin-bottom:3px;font-family:var(--mono)}
.cstats .sv{font-family:var(--mono);font-size:14px;font-weight:600}
.scard details>summary.cmore{display:block;padding:8px 12px;border-top:1px solid var(--grid);font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--accent);cursor:pointer;list-style:none;letter-spacing:.03em}
.scard details>summary.cmore::-webkit-details-marker{display:none}
.scard details[open]>summary.cmore{border-bottom:1px solid var(--grid)}
.cdetail{padding:12px;background:var(--panel2)}
.cdetail .grid,.cdetail .card:last-child{margin-bottom:0}
.al-row{display:flex;align-items:center;gap:9px;margin:6px 0}
.al-row .k{width:32px;font-size:11px;color:var(--muted);flex:none}
.al-bar{flex:1;position:relative;height:9px;background:var(--inset);border:1px solid var(--grid);border-radius:2px}
.al-bar .mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--faint);opacity:.5}
.al-bar .fill{position:absolute;top:0;bottom:0}
.al-bar .fill.up{background:var(--up)}.al-bar .fill.down{background:var(--down)}
.al-row .v{width:56px;text-align:right;font-family:var(--mono);font-size:11.5px;font-weight:600;flex:none}
.al-row .v .ph{font-family:var(--sans);font-size:8.5px;color:var(--faint);font-weight:500;margin-left:2px}
.lad .lrow{display:flex;justify-content:space-between;font-size:10.5px;font-family:var(--mono);color:var(--muted);margin-bottom:4px}
.lad .ltrack{position:relative;height:14px;background:var(--inset);border:1px solid var(--grid);border-radius:3px}
.lad .ldot{position:absolute;top:50%;transform:translate(-50%,-50%);width:12px;height:12px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}

const LS={url:"pipx_url",ivl:"pipx_ivl"};
const f=(v,d=1)=>v==null?"–":Number(v).toFixed(d);
const sg=(v,d=1)=>v==null?"–":(v>0?"+":"")+Number(v).toFixed(d);
const arw=v=>v>0?"▲":(v<0?"▼":"—");
const cls=v=>v>0?"up":(v<0?"down":"flat");
let CUR="", PTL="핍";
const money=v=>v==null?"–":CUR+Number(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:5});
const mix=(c,p)=>`color-mix(in srgb, ${c} ${Math.round(p)}%, var(--surface))`;

/* ===== 샘플 (실제 JSON 스키마와 동일) — EURUSD ===== */
const SAMPLE={
 sym:"EURUSD", session:"런던 본장", market:"정규장 실시간 연동 중",

/* ===== 컨텍스트 자동 해석 ===== */
function ctxOf(d){
  const S=d.dir.session,Da=d.dir.daily,W=d.dir.weekly,H=d.dir.h4;
  const layers=[+S.strength,+Da.strength,+W.strength,+H.done];
  let up=0,dn=0; layers.forEach(v=>{ if(v>0)up++; else if(v<0)dn++; });
  const net=up-dn, dir=net>0?1:(net<0?-1:0);
  const align=dir===0?Math.max(up,dn):(dir>0?up:dn);
  const h4trend=Math.abs(H.done)>H.avg;
  const dirWord=dir<0?"하방":"상방";
  let verd,vtone;
  if(dir===0){verd="관망";vtone="flat";}
  else if(h4trend&&align>=3){verd=dir<0?"숏 대기":"롱 대기";vtone=dir<0?"down":"up";}
  else{verd="관망";vtone="flat";}
  const biasWord=dir<0?"하방 우위":(dir>0?"상방 우위":"혼조");
  let guide;
  if(dir===0) guide="세션·일간·주간·H4 방향이 엇갈립니다. 정렬될 때까지 관망 우위 — 무리한 진입 자제.";
  else if(!h4trend) guide="H4가 횡보 국면. 되돌림·레인지 성격 — 추세 진입 신뢰도 낮음, 신중.";
  else if(align>=3) guide=`H4 ${dirWord} 추세 + 다층 정렬(${align}/4). 같은 방향 인걸핑 자리를 우선 관찰할 국면.`;
  else guide=`H4는 ${dirWord} 추세지만 하위 정렬이 약함(${align}/4). 정렬 강화 여부 확인.`;

  const alignRead = dir===0
    ? "네 층 방향이 엇갈림 — 방향 합의 없음, 관망."
    : `<b>${align}/4 ${dirWord} 정렬</b> · H4 ${h4trend?"추세":"횡보"} — ${align>=3?"방향 합의 강함.":"합의 약함, 신중."}`;
  const alignTone = dir===0?"flat":(align>=3?(dir<0?"down":"up"):"flat");

  const side=dir<0?"하단":"상단";
  const sReach=(S.levels&&S.levels.length)?S.levels[S.levels.length-1].reach:null;
  const dReach=(Da.levels&&Da.levels.length)?Da.levels[0].reach:null;
  const wReach=(W.levels&&W.levels.length)?W.levels[0].reach:null;
  const lbl=r=>r==null?"–":(r>100?`돌파 ${f(r,0)}%`:(r>=85?`근접 ${f(r,0)}%`:`진행 ${f(r,0)}%`));
  const overCnt=[sReach,dReach,wReach].filter(r=>r!=null&&r>100).length;
  let conc = dir===0?"" : (overCnt>=2?`${side} 자리 거의 소진 — 추격보다 되돌림 대기.`
              :([sReach,dReach].every(r=>r!=null&&r<70)?`${side} 여력 남음 — 추세 자리 유효.`:`${side} 자리 진행 중.`));
  const spotRead = dir===0?"방향 미정 — 자리 판단 보류."
     :`세션 ${side} <b>${lbl(sReach)}</b> · 일간 ${lbl(dReach)} · 주간 ${lbl(wReach)}. ${conc}`;
  const spotTone = dir===0?"flat":(overCnt>=2?"flat":(dir<0?"down":"up"));

  const fl=d.flow, valid=fl&&fl.h4&&fl.h4.valid;
  let forceRead="체결 데이터 없음(휴장/보관량).", forceTone="flat";
  if(valid){
    const dom=fl.h4.dom, bars=(fl.zone&&fl.zone.bars)||[];
    const first=bars.length?bars[0].dom:dom, last=bars.length?bars[bars.length-1].dom:dom, dv=last-first;
    const trend = Math.abs(dv)<=0.3?"유지":(Math.sign(dv)===Math.sign(last)?"점점 강해짐":"약해짐");
    const agree = dir!==0 && Math.sign(dom)===dir;
    const conc2 = dir===0?"" : (agree?"방향과 같은 쪽 — 힘 실림.":"⚠ 방향과 반대 — 진입 서두르지 말 것.");
    forceRead=`<b>${dom<0?"매도":"매수"} 우위 ${sg(dom,1)}%</b> (${trend}). ${conc2}`;
    forceTone = dir===0?"flat":(agree?(dir<0?"down":"up"):"flat");
  }
  return {dir,align,h4trend,verd,vtone,biasWord,guide,alignRead,alignTone,spotRead,spotTone,forceRead,forceTone};
}
function readBox(tone,html){return `<div class="read ${tone}"><span class="rk">읽기</span><span>${html}</span></div>`;}

/* ===== 값 무결성 점검 (들어온 JSON을 화면에 쓰기 전에 검사) ===== */
const fin=v=>typeof v==="number"&&isFinite(v);
function validate(d){
  const bad=[], warn=[];
  if(!d||typeof d!=="object"){return {status:"bad",issues:["데이터 없음/형식 오류"]};}
  if(!fin(d.price)||d.price<=0) bad.push("현재가 이상");
  const D=d.dir;
  if(!D||!D.session||!D.daily||!D.weekly||!D.h4){ bad.push("방향강도 데이터 누락"); }
  else{
    [["세션",D.session],["일간",D.daily],["주간",D.weekly]].forEach(([k,r])=>{
      if(!fin(r.strength)||Math.abs(r.strength)>105) warn.push(k+" 방향강도 이상");
      if(!fin(r.avg)||r.avg<0) warn.push(k+" 평균 이상");
      (r.levels||[]).forEach(L=>{
        if(!fin(L.up)||!fin(L.dn)||L.up<=L.dn) warn.push(k+" 레벨 역전/이상");
        if(fin(L.reach)&&Math.abs(L.reach)>400) warn.push(k+" 도달률 비정상("+f(L.reach,0)+"% · 히스토리 부족?)");
      });
    });
    if(!fin(D.h4.done)||Math.abs(D.h4.done)>105) warn.push("H4 방향강도 이상");
    if(!fin(D.h4.h1pos)||D.h4.h1pos<-1||D.h4.h1pos>101) warn.push("H1 위치 이상");
  }
  const fl=d.flow;
  if(fl&&fl.h4&&fl.h4.valid){
    const h=fl.h4;
    if(!fin(h.dom)||Math.abs(h.dom)>100) warn.push("체결 우위 이상");
    if(!fin(h.total)||h.total<0) warn.push("체결 틱수 이상");
  }
  const status = bad.length?"bad":(warn.length?"warn":"ok");
  return {status, issues:bad.concat(warn)};
}
function renderDq(d){
  const el=$("#dq"); if(!el) return;
  const v=validate(d);
  el.className="dq "+v.status; el.hidden=false;
  if(v.status==="ok"){ el.innerHTML=`🟢 데이터 정상 · 필드·범위·레벨 점검 통과`; }
  else{
    const icon=v.status==="bad"?"🔴":"🟡";
    const head=v.status==="bad"?"데이터 이상 — 값 신뢰 불가":"데이터 점검 "+v.issues.length+"건";
    el.innerHTML=`${icon} <b>${head}</b> · ${v.issues.slice(0,4).join(" · ")}${v.issues.length>4?" 외":""}`;
  }
}
function secH(n,title,hint){return `<div class="sec-h"><span class="n">${n}</span><h2>${title}</h2><span class="ln"></span>${hint?`<span class="hint">${hint}</span>`:""}</div>`;}

/* ===== 모노크롬 히트 (밝음=상승 / 어두움=하락) ===== */
function heatStr(v){ if(v==null)return "transparent"; const p=Math.min(1,Math.abs(v)/100)*24+5; return v>0?`color-mix(in srgb, var(--up) ${p}%, var(--surface))`:`color-mix(in srgb, var(--down) ${p}%, var(--surface))`; }
function heatReach(r){ if(r==null)return "transparent"; const p=Math.min(1,r/120)*30+6; return `color-mix(in srgb, var(--accent) ${p}%, var(--surface))`; }
function reachMeter(reach,dir){
  const mag=Math.min(100,Math.abs(reach||0)), c=dir>=0?"up":"down", over=Math.abs(reach||0)>100;
  return `<div class="track"><div class="fill ${c}" style="left:0;width:${mag}%"></div>
    ${over?'<div class="fill '+c+'" style="right:0;width:5px;opacity:.6"></div>':''}</div>`;
}
function domMeter(dom,scale){
  const r=Math.max(-100,Math.min(100,(dom||0)*(scale||1))), half=Math.abs(r)/100*50;
  const side=r>=0?`left:50%;width:${half}%`:`right:50%;width:${half}%`, cc=r>=0?"up":"down";
  return `<div class="track"><div class="mid"></div><div class="fill ${cc}" style="${side}"></div></div>`;
}

/* ===== 판정 ===== */
function heroBlock(d,c){
  const ar=c.dir<0?"▼":(c.dir>0?"▲":"↔");
  const pips=[0,1,2,3].map(i=>`<span class="pip ${i<c.align?'on':''}"></span>`).join("");
  return `<div class="hero ${c.vtone}">
    <div class="hero-top">
      <span class="ar-badge ${c.vtone}">${ar}</span>
      <div class="hero-mid"><span class="verd ${c.vtone}">${c.verd}</span><span class="binfo">BIAS ${c.biasWord} · S·D·W·H4 종합</span></div>
      <div class="algn"><div class="pips">${pips}</div><span>ALIGN ${c.align}/4</span></div>
    </div>
    <div class="guide">${c.guide}</div></div>`;
}

/* ===== 정렬 매트릭스 ===== */
function matrixCard(d,c){
  const rows=[["세션",d.dir.session],["일간",d.dir.daily],["주간",d.dir.weekly]];
  let body=rows.map(([k,r])=>{
    const trend=Math.abs(r.strength)>r.avg;
    const reach=(r.levels&&r.levels.length)?r.levels[r.levels.length-1].reach:null;
    return `<tr><td class="k">${k}</td>
      <td class="${cls(r.strength)}" style="background:${heatStr(r.strength)}">${arw(r.strength)} ${f(Math.abs(r.strength),0)}<span class="sub">${trend?"추세":"횡보"}</span></td>
      <td style="background:${heatReach(reach)}">${reach!=null?f(reach,0)+"%":"–"}</td>
      <td>${f(r.tickvol_pct,0)}%</td></tr>`;
  }).join("");
  const H=d.dir.h4, h4t=Math.abs(H.done)>H.avg;
  body+=`<tr><td class="k">H4</td>
    <td class="${cls(H.done)}" style="background:${heatStr(H.done)}">${arw(H.done)} ${f(Math.abs(H.done),0)}<span class="sub">${h4t?"추세":"횡보"}</span></td>
    <td class="empty">위치 ${f(H.h1pos,0)}%</td><td class="empty">–</td></tr>`;
  return `<div class="card">${readBox(c.alignTone,c.alignRead)}
    <table class="mtx"><thead><tr><th>LAYER</th><th>방향강도</th><th>도달률</th><th>틱볼륨</th></tr></thead><tbody>${body}</tbody></table>
    <div class="legend"><span class="up">■</span> 밝음=상승 &nbsp; <span class="down">■</span> 어두움=하락 &nbsp; <span style="color:var(--accent)">■</span> 도달률</div></div>`;
}

/* ===== dir 상세 ===== */
function dirCard(title,d){
  const phase = d.trend>d.avg?`<span class="pill tr">추세</span>`:`<span class="pill rg">횡보</span>`;
  const lv=(d.levels||[]).map(L=>`
    <div class="lvl"><div class="lh">${L.name}</div>
      <div class="pair"><span class="up">상단 ${money(L.up)} <small>(${sg(L.up_pt,1)}${PTL})</small></span>
        <span class="down">하단 ${money(L.dn)} <small>(${sg(L.dn_pt,1)}${PTL})</small></span></div>
      ${reachMeter(L.reach,L.dir)}
      <div class="cap"><span>도달률</span><span class="rt">${f(L.reach,1)}% · ${L.reach_txt||""}</span></div></div>`).join("");
  return `<div class="card">
    <div class="card-h"><span class="t">${title}</span>${phase}</div>
    <div class="hdln"><span class="v ${cls(d.strength)}">${arw(d.strength)} 추세율 ${f(d.trend,1)}%</span><span class="avg">평균 ${f(d.avg,1)}%</span></div>
    <div class="rows">
      <div class="r"><span class="k">시가 (시가대비)</span><span class="val">${money(d.open)} <span class="${cls(d.chgpct)}">(${sg(d.chgpct,2)}%)</span></span></div>
      <div class="r"><span class="k">변동 고저 / 시종</span><span class="val">${f(d.range_pt,1)}${PTL} / ${sg(d.oc_pt,1)}${PTL}</span></div>
    </div>
    <div class="tv"><div class="r"><span class="k">틱볼륨</span><span class="val">${f(d.tickvol_pct,1)}% <small>(${(d.tickvol_cnt||0).toLocaleString()} Ticks)</small></span></div>
      <div class="bar"><i style="width:${Math.min(100,d.tickvol_pct||0)}%"></i></div></div>
    ${lv}</div>`;
}
function h4Card(h){
  const phase=Math.abs(h.done)>h.avg?`<span class="pill tr">추세</span>`:`<span class="pill rg">횡보</span>`;
  return `<div class="card">
    <div class="card-h"><span class="t">H4 국면 (전략)</span>${phase}</div>
    <div class="hdln"><span class="v ${cls(h.done)}">${arw(h.done)} ${sg(h.done,0)}%</span><span class="avg">완성 · 평균 ${f(h.avg,0)}%</span></div>
    <div class="rows">

function spotCard(d,c){
  const price=d.price;

  const gp=v=>sg((v-price)/pipSize,0);

  const items=sets.filter(([,r])=>r.levels&&r.levels.length).map(([k,r,col])=>{
    const L=r.levels[r.levels.length-1];

  });

  const W=214,H=300,padT=16,padB=16,X0=48,xT=126;

  for(let i=0;i<=4;i++){const yy=padT+i/4*(H-padT-padB);g+=`<line x1="${X0}" y1="${yy.toFixed(1)}" x2="${xT}" y2="${yy.toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>`;}
  let lines="";
  items.forEach(i=>{
    [["상",i.up],["하",i.dn]].forEach(([s,val])=>{
      lines+=`<line x1="${X0}" y1="${y(val).toFixed(1)}" x2="${xT}" y2="${y(val).toFixed(1)}" stroke="${i.col}" stroke-width="1.6" stroke-dasharray="${s==='상'?'0':'3 3'}" opacity=".9"/>`;
    });
  });
  let labs=[]; items.forEach(i=>{labs.push({t:i.k[0]+"상 "+gp(i.up),v:i.up,c:i.col});labs.push({t:i.k[0]+"하 "+gp(i.dn),v:i.dn,c:i.col});});
  labs=labs.map(o=>({...o,yy:y(o.v)})).sort((a,b)=>a.yy-b.yy);
  for(let j=1;j<labs.length;j++){ if(labs[j].yy-labs[j-1].yy<11.5) labs[j].yy=labs[j-1].yy+11.5; }
  const labSvg=labs.map(o=>`<text x="${xT+4}" y="${(o.yy+3.5).toFixed(1)}" font-size="9.5" font-family="var(--mono)" fill="${o.c}" font-weight="600">${o.t}</text>`).join("");
  const py=y(price);
  const priceMark=`<line x1="${X0}" y1="${py.toFixed(1)}" x2="${xT}" y2="${py.toFixed(1)}" stroke="var(--up)" stroke-width="2.5"/>
    <circle cx="${xT}" cy="${py.toFixed(1)}" r="3.5" fill="var(--up)"/>
    <text x="${X0-4}" y="${(py+3.5).toFixed(1)}" text-anchor="end" font-size="9.5" font-family="var(--mono)" fill="var(--up)" font-weight="700">${money(price)}</text>`;
  const legend=items.map(i=>{const rc=i.rdir<0?"down":(i.rdir>0?"up":"flat");
    return `<div class="lgrow"><span class="dot2" style="background:${i.col}"></span><span class="nm">${i.k}</span>
      <span class="rg">${money(i.dn)}~${money(i.up)}</span><span class="rr ${rc}">${f(i.reach,0)}%</span></div>`;}).join("");
  return `<div class="card">${readBox(c.spotTone,c.spotRead)}
    <div class="axis-wrap">
      <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="레벨 대비 현재가 위치">
        ${g}<line x1="${X0}" y1="${padT-6}" x2="${X0}" y2="${H-padB+6}" stroke="var(--line)" stroke-width="1.5"/>
        ${lines}${labSvg}${priceMark}
      </svg>
      <div class="axis-side">${legend}
        <div class="axis-note">선 옆 숫자 = 현재가와의 갭(핍, +위/−아래) · 실선=상단·점선=하단 · 흰선=현재가 · 우측 %=도달률</div>
      </div>
    </div></div>`;
}

function ladderViz(d){

  const L=S.levels[S.levels.length-1], price=d.price, ps=pipSizeOf(d), dn=L.dn, up=L.up;

  </div>`;
}
function targetLadder(d){
  const price=d.price, ps=pipSizeOf(d);
  const S=d.dir.session,Da=d.dir.daily,W=d.dir.weekly;
  const s1=S.levels&&S.levels[0], s2=S.levels&&S.levels[S.levels.length-1];
  const dl=Da.levels&&Da.levels[0], wl=W.levels&&W.levels[0];
  const defs=[];
  if(s1)defs.push({label:"세션½",role:"50%·본절",up:s1.up,dn:s1.dn});
  if(s2&&s2!==s1)defs.push({label:"세션",role:"TP·세션",up:s2.up,dn:s2.dn});
  if(dl)defs.push({label:"일간",role:"TP·일간",up:dl.up,dn:dl.dn});
  if(wl)defs.push({label:"주간",role:"TP·주간",up:wl.up,dn:wl.dn});
  if(!defs.length) return `<div class="r"><span class="k">레벨 데이터 없음</span></div>`;

    return `<div class="tl-row${brk?' brk':''}${near?' near':''}"><span class="tl-lb">${x.label}</span><span class="tl-p">${money(x.p)}</span><span class="tl-g ${gcls}">${sg(gap,0)}${PTL}${brk?'·돌파':''}</span><span class="tl-role">${x.role}</span></div>`;
  };

function forceViz(d){

    <div class="cap" style="margin:0 0 6px"><span>가격 4H 실이동 (캔들)</span><span class="rt ${cls(h.net)}">${sg(h.net,1)}${u} ${cand.a}</span></div>

  let labs=[]; items.forEach(i=>{labs.push({t:i.k[0]+"상 "+gp(i.up),v:i.up,c:i.col});labs.push({t:i.k[0]+"하 "+gp(i.dn),v:i.dn,c:i.col});});
  labs=labs.map(o=>({...o,yy:y(o.v)})).sort((a,b)=>a.yy-b.yy); for(let j=1;j<labs.length;j++){if(labs[j].yy-labs[j-1].yy<11.5)labs[j].yy=labs[j-1].yy+11.5;}
  const labSvg=labs.map(o=>`<text x="${xT+4}" y="${(o.yy+3.5).toFixed(1)}" font-size="9.5" font-family="var(--mono)" fill="${o.c}" font-weight="600">${o.t}</text>`).join("");
  const py=y(price);
  const priceMark=`<line x1="${X0}" y1="${py.toFixed(1)}" x2="${xT}" y2="${py.toFixed(1)}" stroke="var(--up)" stroke-width="2.5"/><circle cx="${xT}" cy="${py.toFixed(1)}" r="3.5" fill="var(--up)"/><text x="${X0-4}" y="${(py+3.5).toFixed(1)}" text-anchor="end" font-size="9.5" font-family="var(--mono)" fill="var(--up)" font-weight="700">${money(price)}</text>`;
  const legend=items.map(i=>{const rc=i.rdir<0?"down":(i.rdir>0?"up":"flat");return `<div class="lgrow"><span class="dot2" style="background:${i.col}"></span><span class="nm">${i.k}</span><span class="rg">${money(i.dn)}~${money(i.up)}</span><span class="rr ${rc}">${f(i.reach,0)}%</span></div>`;}).join("");
  return `<div class="axis-wrap"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img">${g}<line x1="${X0}" y1="${padT-6}" x2="${X0}" y2="${H-padB+6}" stroke="var(--line)" stroke-width="1.5"/>${lines}${labSvg}${priceMark}</svg><div class="axis-side">${legend}<div class="axis-note">선 옆 숫자=현재가 갭(${PTL},+위/−아래) · 실선=상단·점선=하단 · 흰선=현재가 · 우측 %=도달률</div></div></div>`;
}
function detailFlow(d){
  const fl=d.flow,u=fl&&fl.unit||"",h=fl&&fl.h4; let s="";
  if(h&&h.valid){
    s+=`<div class="cap" style="margin:0 0 3px"><span>매도</span><span>매수</span></div>${domMeter(h.dom,10)}
      <div class="rows" style="margin-top:8px">
      <div class="r"><span class="k">누적틱 (왜곡)</span><span class="val">${(h.total||0).toLocaleString()} <small>(${h.distort||0})</small></span></div>
      <div class="r"><span class="k">순이동 / 고저폭</span><span class="val ${cls(h.net)}">${sg(h.net,1)}${u} / ${f(h.span,1)}${u}</span></div></div>`;
  }
  if(fl&&fl.zone){ s+=`<div class="card" style="margin-top:10px"><div class="card-h"><span class="t">${fl.zone.tf} 시계열</span></div>${(fl.zone.bars||[]).map(b=>flowSeries(b,u)).join("")}</div>`; }
  if(fl&&fl.entry){ s+=`<div class="card"><div class="card-h"><span class="t">${fl.entry.tf} 완성 vs 진행</span></div><div class="cmp">${flowCol("직전 완성봉 (-1)",fl.entry.done,u)}${flowCol("현재 진행봉",fl.entry.now,u)}</div></div>`; }
  return s;
}
function stdCard(o){
  const stats=o.stats.map(s=>`<div class="s"><div class="sk">${s.k}</div><div class="sv ${s.cls||''}">${s.v}</div></div>`).join("");
  const det=o.detailHtml?`<details><summary class="cmore">${o.detailLabel} ▾</summary><div class="cdetail">${o.detailHtml}</div></details>`:"";
  return `<div class="scard">
    <div class="chead"><span class="t">${o.title}</span><span class="sub">${o.sub||""}</span><span class="st ${o.stTone}">${o.stTxt}</span></div>
    <div class="cread"><span class="rk">읽기</span><span>${o.read}</span></div>
    <div class="cviz">${o.viz}</div>
    <div class="cstats">${stats}</div>${det}</div>`;
}
function verdictCard(d,c){
  const ar=c.dir<0?"▼":(c.dir>0?"▲":"↔");
  const pips=[0,1,2,3].map(i=>`<span class="pip ${i<c.align?'on':''}"></span>`).join("");
  return `<div class="verdict ${c.vtone}">
    <div class="vtop"><span class="vbadge ${c.vtone}">${ar}</span>
      <div class="vmid"><div class="lab">결론</div><div class="verd2 ${c.vtone}">${c.verd}</div><div class="binfo">BIAS ${c.biasWord} · S·D·W·H4 종합</div></div>
      <div class="valn"><div class="pips">${pips}</div><span>ALIGN ${c.align}/4</span></div></div>
    <div class="vguide">${c.guide}</div></div>`;
}

/* ===== render ===== */
function render(d){
  CUR=d.cur||""; PTL=d.ptl||"pt";
  $("#sym").textContent=d.sym||"—";
  $("#sess").textContent=d.session||"—";
  $("#price").textContent=d.price!=null?money(d.price):"—";
  renderDq(d);
  const c=ctxOf(d), dir=c.dir, dirWord=dir<0?"하방":(dir>0?"상방":"혼조");
  const H=d.dir.h4, h4t=Math.abs(H.done)>H.avg, strong=strongestLayer(d);

  // ① 방향
  SBFIRST=true;
  const card1=stdCard({title:"방향",sub:"층 정렬 ×4",stTone:c.alignTone,
    stTxt: dir===0?"↔ 혼조":`${arw(dir)} ${dirWord} ${c.align}/4`,
    read:c.alignRead, viz:alignViz(d),
    stats:[{k:"정렬",v:c.align+"/4"},{k:"H4 국면",v:(h4t?"추세":"횡보")+" "+arw(H.done),cls:cls(H.done)},{k:"최강 층",v:strong[0]+" "+f(Math.abs(strong[1]),0),cls:cls(strong[1])}],
    detailLabel:"자세히 — 세션·일간·주간·H4 전체 수치",
    detailHtml:`<div class="grid">${dirCard("실시간 세션",d.dir.session)}${dirCard("당일 일간",d.dir.daily)}${dirCard("이번주 주간",d.dir.weekly)}${h4Card(d.dir.h4)}</div>`});

  // ② 자리
  const S=d.dir.session, ps=pipSizeOf(d); let sReach=null,gU="–",gD="–";
  if(S.levels&&S.levels.length){const L=S.levels[S.levels.length-1]; sReach=L.reach; gU=sg((L.up-d.price)/ps,0); gD=sg((L.dn-d.price)/ps,0);}
  const card2=stdCard({title:"자리",sub:"레벨 대비 위치",stTone:c.spotTone,
    stTxt: dir===0?"판단 보류":(sReach!=null?(sReach>100?"돌파":(sReach>=85?"근접":"여력 있음")):"–"),
    read:c.spotRead, viz:targetLadder(d),
    stats:[{k:"세션 도달률",v:sReach!=null?f(sReach,0)+"%":"–"},{k:"상단 갭",v:gU+PTL,cls:"up"},{k:"하단 갭",v:gD+PTL,cls:"down"}],
    detailLabel:"자세히 — 세션·일간·주간 레벨 축 그래프",
    detailHtml:axisGraph(d)});

  // ③ 힘
  SBFIRST=true;
  const fl=d.flow,h=fl&&fl.h4, valid=h&&h.valid;
  let f3trend="–",f3agree="–",f3st="데이터 없음";
  if(valid){const bars=(fl.zone&&fl.zone.bars)||[];const first=bars.length?bars[0].dom:h.dom,last=bars.length?bars[bars.length-1].dom:h.dom,dv=last-first;
    const dm=h.dom<0?"▼":"▲";
    f3trend=Math.abs(dv)<=0.3?"유지":(Math.sign(dv)===Math.sign(last)?"강해짐 "+dm:"약해짐 "+dm);
    f3agree=(dir!==0&&Math.sign(h.dom)===dir)?"✓":(dir!==0?"✗":"—");
    const nf=Math.abs(h.net)<0.1,bl=Math.abs(h.dom)<0.5,ag=!nf&&!bl&&Math.sign(h.net)===Math.sign(h.dom);
    f3st=(nf||bl)?"관망":(ag?"추세 확인":"⚠ 다이버전스");}
  const card3=stdCard({title:"힘",sub:"캔들 vs 체결 4H",stTone:c.forceTone,
    stTxt: f3st,
    read:c.forceRead, viz:forceViz(d),
    stats: valid?[{k:"체결우위",v:sg(h.dom,1)+"%",cls:cls(h.dom)},{k:"추세",v:f3trend,cls:cls(h.dom)},{k:"방향 일치",v:f3agree,cls:f3agree==="✓"?(dir<0?"down":"up"):"flat"}]
                :[{k:"체결우위",v:"–"},{k:"추세",v:"–"},{k:"방향 일치",v:"–"}],
    detailLabel:"자세히 — 1H 시계열 · 5M 완성 vs 진행",
    detailHtml: valid?detailFlow(d):`<div class="r"><span class="k">휴장/보관량으로 틱 데이터 없음</span></div>`});

  $("#app").innerHTML = verdictCard(d,c)
    + `<div class="because"><span class="ln"></span>왜 그런가 · 근거 3단계<span class="ln"></span></div>`
    + `<div class="funnel">`
    + `<div class="step"><div class="num">1</div><div class="body">${card1}</div></div>`
    + `<div class="step"><div class="num">2</div><div class="body">${card2}</div></div>`
    + `<div class="step"><div class="num">3</div><div class="body">${card3}</div></div>`
    + `</div>`;
}

/* ===== live ===== */
let timer=null;
function setStatus(kind,msg){$("#dot").className="dot "+(kind||"");$("#status").textContent=msg;$("#banner").style.display=kind==="live"?"none":"block";}
async function tick(){
  const url=localStorage.getItem(LS.url);
  if(!url){render(SAMPLE);setStatus("sample","SAMPLE");return;}
  try{
    const res=await fetch(url,{cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    let data=await res.json(); if(data&&data.payload)data=data.payload;
    render(data);
    const t=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    setStatus("live","LIVE · "+t+(data.kst?" (봉 "+data.kst+")":""));
  }catch(e){render(SAMPLE);setStatus("sample","연결 실패 — 샘플 ("+e.message+")");}
}
function loop(){if(timer)clearInterval(timer);const ivl=Math.max(10,parseInt(localStorage.getItem(LS.ivl)||"30",10))*1000;tick();if(localStorage.getItem(LS.url))timer=setInterval(tick,ivl);}
const dlg=$("#cfg");
$("#gear").onclick=()=>{$("#url").value=localStorage.getItem(LS.url)||"";$("#ivl").value=localStorage.getItem(LS.ivl)||"30";dlg.showModal();};
$("#save").addEventListener("click",()=>{const u=$("#url").value.trim(),v=$("#ivl").value.trim()||"30";if(u)localStorage.setItem(LS.url,u);else localStorage.removeItem(LS.url);localStorage.setItem(LS.ivl,v);setTimeout(loop,30);});
/* URL 파라미터(?u=주소&ivl=초)로 연결 주소 주입 — 재설치해도 링크가 주소를 기억 */
try{ const q=new URLSearchParams(location.search);
     const qu=q.get('u'); if(qu) localStorage.setItem(LS.url,qu);
     const qv=q.get('ivl'); if(qv) localStorage.setItem(LS.ivl,qv);
}catch(e){}
try{loop();}catch(e){render(SAMPLE);setStatus("sample","SAMPLE");}
/* 항상 최신 화면을 받아오도록 (네트워크 우선 서비스워커) */
if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){} }
</script>
