<style>
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface2:#e7ecf2; --inset:#f3f6f9;
  --ink:#141b26; --muted:#5c6672; --faint:#8a94a1; --line:#d8dfe8;
  --accent:#0e8f86;
  --up:#0c7a5b; --up-bg:#dff3ec; --down:#c23b52; --down-bg:#fbe4e8;
  --flat:#8a7a1f; --flat-bg:#f5efd6;
  --shadow:0 1px 2px rgba(20,27,38,.06),0 3px 10px rgba(20,27,38,.05);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1016;--surface:#151a21;--surface2:#1c232c;--inset:#11161d;
  --ink:#e7edf4;--muted:#93a0af;--faint:#68727f;--line:#2a313b;--accent:#2fd4c2;
  --up:#3fd6a3;--up-bg:#0f2b23;--down:#f4788a;--down-bg:#31161d;--flat:#e2bd52;--flat-bg:#2c2712;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --bg:#0d1016;--surface:#151a21;--surface2:#1c232c;--inset:#11161d;
  --ink:#e7edf4;--muted:#93a0af;--faint:#68727f;--line:#2a313b;--accent:#2fd4c2;
  --up:#3fd6a3;--up-bg:#0f2b23;--down:#f4788a;--down-bg:#31161d;--flat:#e2bd52;--flat-bg:#2c2712;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;margin:0;padding:0 13px 44px;-webkit-text-size-adjust:100%}
.wrap{max-width:520px;margin:0 auto}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--flat)}

.topbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:11px 0 9px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tb-row{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.sym{font-size:18px;font-weight:700;letter-spacing:.02em}
.sess{font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.price{font-family:var(--mono);font-size:23px;font-weight:600;margin-left:auto;letter-spacing:-.01em}
.tb-sub{display:flex;align-items:center;gap:8px;margin-top:5px;color:var(--muted);font-size:11.5px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);display:inline-block}
.dot.live{background:var(--up)}.dot.sample{background:var(--flat)}
.gear{margin-left:auto;background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:4px 10px;font:inherit;font-size:11.5px;cursor:pointer}
.gear:hover{color:var(--ink);border-color:var(--muted)}

/* 판정 hero */
.hero{border-radius:16px;padding:14px 15px;margin-bottom:14px;border:1px solid var(--line);box-shadow:var(--shadow);background:var(--surface);border-left:6px solid var(--faint)}
.hero.up{border-left-color:var(--up)}.hero.down{border-left-color:var(--down)}.hero.flat{border-left-color:var(--flat)}
.hero-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.hero .ar{font-size:34px;font-weight:700;line-height:1}
.hero .verd{font-size:23px;font-weight:700;line-height:1.1;letter-spacing:-.01em;display:block}
.hero .binfo{font-size:11.5px;color:var(--muted)}
.hero .algn{margin-left:auto;text-align:right;flex:none}
.hero .algn b{font-family:var(--mono);font-size:24px;font-weight:600;line-height:1}
.hero .algn span{display:block;font-size:10px;color:var(--muted);margin-top:2px}
.hero .guide{font-size:12.5px;line-height:1.5;color:var(--ink);background:var(--inset);border-radius:10px;padding:9px 11px}

/* section card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:13px 14px;box-shadow:var(--shadow);margin-bottom:13px}
.c-h{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.c-h .n{font-family:var(--mono);font-size:11px;font-weight:700;color:#fff;background:var(--accent);border-radius:6px;padding:1px 7px}
.c-h h2{font-size:14.5px;font-weight:700;margin:0}
.c-h .hint{margin-left:auto;font-size:10.5px;color:var(--faint)}

/* 읽기 callout */
.read{display:flex;gap:8px;font-size:12.5px;line-height:1.5;border-radius:10px;padding:9px 11px;margin-bottom:11px;background:var(--surface2)}
.read.up{background:var(--up-bg)}.read.down{background:var(--down-bg)}.read.flat{background:var(--flat-bg)}
.read .rk{font-weight:700;flex:none}
.read.up .rk{color:var(--up)}.read.down .rk{color:var(--down)}.read.flat .rk{color:var(--flat)}
.read b{font-weight:700}

/* 정렬 matrix */
.mtx{width:100%;border-collapse:separate;border-spacing:3px;font-family:var(--mono)}
.mtx th{font-family:var(--sans);font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.02em;padding:1px 4px;text-align:center;white-space:nowrap}
.mtx th:first-child{text-align:left}
.mtx td{font-size:13px;font-weight:600;text-align:center;padding:8px 4px;border-radius:8px;background:var(--inset);color:var(--ink)}
.mtx td.k{font-family:var(--sans);font-weight:700;text-align:left;background:transparent;white-space:nowrap;font-size:12.5px}
.mtx td .sub{display:block;font-family:var(--sans);font-size:9px;font-weight:600;opacity:.72;margin-top:1px}
.mtx td.empty{color:var(--faint);background:transparent;font-weight:400}
.legend{display:flex;align-items:center;gap:6px;justify-content:center;margin-top:8px;font-size:10px;color:var(--muted)}
.legend .sw{height:9px;width:26px;border-radius:3px}

/* 자리 range bars */
.rb+.rb{margin-top:10px}
.rb-h{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;margin-bottom:4px}
.rb-h .k{color:var(--muted);font-weight:600}
.rb-h .r{font-family:var(--mono);font-weight:600}
.rb-track{position:relative;height:13px;background:var(--inset);border-radius:7px;border:1px solid var(--line)}
.rb-dot{position:absolute;top:50%;transform:translate(-50%,-50%);width:12px;height:12px;border-radius:50%;background:var(--ink);border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.rb-over{position:absolute;top:50%;transform:translateY(-50%);font-size:10px;font-weight:700}
.rb-cap{display:flex;justify-content:space-between;font-size:9.5px;color:var(--faint);font-family:var(--mono);margin-top:2px}

/* 힘 */
.track{position:relative;height:9px;background:var(--inset);border-radius:999px;overflow:hidden;margin:4px 0}
.track .mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line)}
.fill{position:absolute;top:0;bottom:0}
.fill.up{background:var(--up)}.fill.down{background:var(--down)}
.cap{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted)}
.cap .rt{font-family:var(--mono);font-weight:600}
.spark-wrap{margin-top:11px;border-top:1px dashed var(--line);padding-top:10px}
.spark-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.spark-h .t{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.02em}
.spark-h .c{font-size:11px;font-weight:600}
.spark{display:flex;align-items:flex-end;gap:6px;height:46px}
.spark .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px}
.spark .bar{width:100%;border-radius:4px 4px 2px 2px}
.spark .lb{font-family:var(--mono);font-size:9px;color:var(--faint)}
.cmp2{display:grid;grid-template-columns:1fr auto 1fr;gap:4px 8px;margin-top:11px;border-top:1px dashed var(--line);padding-top:10px;font-size:12px;align-items:center}
.cmp2 .k{grid-column:1/-1;font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.02em;margin-bottom:-2px}
.cmp2 .a{font-family:var(--mono);color:var(--faint);text-align:right}
.cmp2 .ar{color:var(--faint);text-align:center;font-size:11px}
.cmp2 .b{font-family:var(--mono);font-weight:600}

.banner{background:var(--flat-bg);color:var(--flat);border-radius:10px;padding:8px 12px;font-size:12px;font-weight:500;margin-bottom:12px}
.note{color:var(--faint);font-size:11px;margin-top:14px;text-align:center;line-height:1.6}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;max-width:420px;width:calc(100% - 32px);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.sheet{padding:18px}.sheet h3{font-size:15px;margin:0 0 4px}.sheet p{color:var(--muted);font-size:12.5px;margin:0 0 14px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field input{font:inherit;font-family:var(--mono);font-size:13px;padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--inset);color:var(--ink)}
.sheet-actions{display:flex;gap:8px;justify-content:flex-end}
.btn{font:inherit;font-weight:600;font-size:13px;padding:8px 15px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:var(--surface2);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <div class="topbar">
    <div class="tb-row">
      <span class="sym" id="sym">EURUSD</span>
      <span class="sess" id="sess">런던 본장</span>
      <span class="price mono" id="price">—</span>
    </div>
    <div class="tb-sub">
      <span class="dot" id="dot"></span><span id="status">—</span>
      <button class="gear" id="gear">⚙ 연결</button>
    </div>
  </div>

  <div class="banner" id="banner">샘플 데이터입니다 · ‘연결’에서 데이터 주소를 넣으면 실시간으로 바뀝니다</div>

  <div id="app"></div>

  <p class="note">각 블록의 <b>‘읽기’</b>는 현재 값을 자동 해석한 문장이에요. 실시간 연결 시 실제 값으로 바뀝니다.<br>
     진입 확정은 이 화면이 아니라 캔들(인걸핑)에서 · 자동매매 아님.</p>
</div>

<dialog id="cfg"><form method="dialog" class="sheet">
  <h3>실시간 연결 설정</h3>
  <p>EA가 현황을 올리는 데이터 주소(URL). 비우면 샘플로 표시됩니다.</p>
  <div class="field"><label for="url">데이터 주소 (JSON URL)</label>
    <input id="url" placeholder="https://getpantry.cloud/apiv1/pantry/…/basket/eurusd" inputmode="url"></div>
  <div class="field"><label for="ivl">갱신 주기(초)</label>
    <input id="ivl" type="number" min="10" step="5" value="30"></div>
  <div class="sheet-actions"><button class="btn" value="cancel">취소</button>
    <button class="btn primary" id="save" value="default">저장</button></div>
</form></dialog>

<script>
"use strict";
const $=s=>document.querySelector(s);
const LS={url:"pipx_url",ivl:"pipx_ivl"};
const f=(v,d=1)=>v==null?"–":Number(v).toFixed(d);
const sg=(v,d=1)=>v==null?"–":(v>0?"+":"")+Number(v).toFixed(d);
const arw=v=>v>0?"▲":(v<0?"▼":"—");
const cls=v=>v>0?"up":(v<0?"down":"flat");
let CUR="", PTL="핍";
const money=v=>v==null?"–":CUR+Number(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:5});
const mix=(c,p)=>`color-mix(in srgb, ${c} ${Math.round(p)}%, var(--surface))`;

/* ===== 샘플 (실제 JSON 스키마와 동일) — EURUSD ===== */
const SAMPLE={
 sym:"EURUSD", session:"런던 본장", market:"정규장 실시간 연동 중",
 price:1.08508, cur:"", ptl:"핍", kst:"19:37", sample:true,
 dir:{
  session:{open:1.08920,chgpct:-0.38,range_pt:47.0,oc_pt:-41.2,strength:-87.6,trend:87.6,avg:34.4,tickvol_pct:18.3,tickvol_cnt:25136,
    levels:[
      {name:"1차 레벨 (50%)",up:1.09070,up_pt:15.0,dn:1.08745,dn_pt:-17.5,reach:234.9,reach_txt:"하단 돌파",dir:-1},
      {name:"최종 레벨 (100%)",up:1.09220,up_pt:30.0,dn:1.08570,dn_pt:-35.0,reach:117.7,reach_txt:"하단 돌파",dir:-1}
    ]},
  daily:{open:1.08980,chgpct:-0.43,range_pt:58.0,oc_pt:-47.2,strength:-81.4,trend:81.4,avg:36.8,tickvol_pct:41.4,tickvol_cnt:137557,
    levels:[{name:"5일 일간 레벨",up:1.09380,up_pt:40.0,dn:1.08480,dn_pt:-50.0,reach:94.0,reach_txt:"하단 근접",dir:-1}]},
  weekly:{open:1.08880,chgpct:-0.34,range_pt:75.0,oc_pt:-37.2,strength:-49.6,trend:49.6,avg:60.2,tickvol_pct:28.9,tickvol_cnt:472187,
    levels:[{name:"4주 주간 레벨",up:1.10080,up_pt:120.0,dn:1.08280,dn_pt:-60.0,reach:61.7,reach_txt:"하단 진행",dir:-1}]},
  h4:{done:-75,avg:40,now:-18,elapsed_pct:33,h1pos:38}
 },
 flow:{ flag:"제공", unit:"핍",
  h4:{valid:true,total:45820,distort:210,up:22100,down:23720,dom:-3.2,net:-18.5,span:58.0},
  zone:{tf:"1H", bars:[
    {tag:"-3",dom:-0.8,eff:0.59,move:5.0},{tag:"-2",dom:-1.1,eff:0.76,move:-8.0},
    {tag:"-1",dom:-3.5,eff:0.84,move:-13.0},{tag:"진행",dom:-5.5,eff:0.77,move:-9.2}
  ]},
  entry:{tf:"5M",
    done:{dom:-3.5,eff:0.84,move:-13.0,total:19633},
    now:{dom:-5.5,eff:0.77,move:-9.2,total:3492}}
 }
};

/* ===== 컨텍스트 자동 해석 ===== */
function ctxOf(d){
  const S=d.dir.session,Da=d.dir.daily,W=d.dir.weekly,H=d.dir.h4;
  const layers=[+S.strength,+Da.strength,+W.strength,+H.done];
  let up=0,dn=0; layers.forEach(v=>{ if(v>0)up++; else if(v<0)dn++; });
  const net=up-dn, dir=net>0?1:(net<0?-1:0);
  const align=dir===0?Math.max(up,dn):(dir>0?up:dn);
  const h4trend=Math.abs(H.done)>H.avg;
  const dirWord=dir<0?"하방":"상방";

  let verd,vtone;
  if(dir===0){verd="관망";vtone="flat";}
  else if(h4trend&&align>=3){verd=dir<0?"숏 대기":"롱 대기";vtone=dir<0?"down":"up";}
  else{verd="관망";vtone="flat";}
  const biasWord=dir<0?"하방 우위":(dir>0?"상방 우위":"혼조");

  let guide;
  if(dir===0) guide="세션·일간·주간·H4 방향이 엇갈립니다. 정렬될 때까지 관망 우위 — 무리한 진입 자제.";
  else if(!h4trend) guide="H4가 횡보 국면. 되돌림·레인지 성격 — 추세 진입 신뢰도 낮음, 신중.";
  else if(align>=3) guide=`H4 ${dirWord} 추세 + 다층 정렬(${align}/4). 같은 방향 인걸핑 자리를 우선 관찰할 국면.`;
  else guide=`H4는 ${dirWord} 추세지만 하위 정렬이 약함(${align}/4). 정렬 강화 여부 확인.`;

  const alignRead = dir===0
    ? "네 층 방향이 엇갈림 — 방향 합의 없음, 관망."
    : `<b>${align}/4 ${dirWord} 정렬</b> · H4 ${h4trend?"추세":"횡보"} — ${align>=3?"방향 합의 강함.":"합의 약함, 신중."}`;
  const alignTone = dir===0?"flat":(align>=3?(dir<0?"down":"up"):"flat");

  const side=dir<0?"하단":"상단";
  const sReach=(S.levels&&S.levels.length)?S.levels[S.levels.length-1].reach:null;
  const dReach=(Da.levels&&Da.levels.length)?Da.levels[0].reach:null;
  const wReach=(W.levels&&W.levels.length)?W.levels[0].reach:null;
  const lbl=r=>r==null?"–":(r>100?`돌파 ${f(r,0)}%`:(r>=85?`근접 ${f(r,0)}%`:`진행 ${f(r,0)}%`));
  const overCnt=[sReach,dReach,wReach].filter(r=>r!=null&&r>100).length;
  let conc = dir===0?"" : (overCnt>=2?`${side} 자리 거의 소진 — 추격보다 되돌림 대기.`
              :([sReach,dReach].every(r=>r!=null&&r<70)?`${side} 여력 남음 — 추세 자리 유효.`:`${side} 자리 진행 중.`));
  const spotRead = dir===0?"방향 미정 — 자리 판단 보류."
     :`세션 ${side} <b>${lbl(sReach)}</b> · 일간 ${lbl(dReach)} · 주간 ${lbl(wReach)}. ${conc}`;
  const spotTone = dir===0?"flat":(overCnt>=2?"flat":(dir<0?"down":"up"));

  const fl=d.flow, valid=fl&&fl.h4&&fl.h4.valid;
  let forceRead="체결 데이터 없음(휴장/보관량).", forceTone="flat", forceAgree=null, dom=null, trend="";
  if(valid){
    dom=fl.h4.dom;
    const bars=(fl.zone&&fl.zone.bars)||[];
    const first=bars.length?bars[0].dom:dom, last=bars.length?bars[bars.length-1].dom:dom;
    trend = last<first-0.3?"점점 강해짐":(last>first+0.3?"약해짐":"유지");
    forceAgree = dir!==0 && Math.sign(dom)===dir;
    const conc2 = dir===0?"" : (forceAgree?"방향과 같은 쪽 — 힘 실림.":"⚠ 방향과 반대 — 진입 서두르지 말 것.");
    forceRead=`<b>${dom<0?"매도":"매수"} 우위 ${sg(dom,1)}%</b> (${trend}). ${conc2}`;
    forceTone = dir===0?"flat":(forceAgree?(dir<0?"down":"up"):"flat");
  }
  return {dir,align,h4trend,verd,vtone,biasWord,guide,alignRead,alignTone,spotRead,spotTone,forceRead,forceTone};
}

/* ===== 블록 빌더 ===== */
function heatStr(v){ if(v==null)return "var(--inset)"; return mix(v>0?"var(--up)":"var(--down)", Math.min(1,Math.abs(v)/100)*58+10); }
function heatReach(r){ if(r==null)return "var(--inset)"; if(r>100)return mix("var(--down)",Math.min(1,(r-100)/100)*52+16); return mix("var(--accent)",(r/100)*42+8); }
function heatTv(t){ if(t==null)return "var(--inset)"; return mix("var(--accent)",Math.min(1,t/100)*48+8); }

function readBox(tone,html){return `<div class="read ${tone}"><span class="rk">읽기</span><span>${html}</span></div>`;}

function heroBlock(d,c){
  const ar=c.dir<0?"▼":(c.dir>0?"▲":"↔");
  return `<div class="hero ${c.vtone}">
    <div class="hero-top">
      <span class="ar ${c.vtone}">${ar}</span>
      <span><span class="verd ${c.vtone}">${c.verd}</span><span class="binfo">편향 ${c.biasWord} · 세션·일간·주간·H4 종합</span></span>
      <span class="algn"><b class="${c.vtone}">${c.align}/4</b><span>정렬</span></span>
    </div>
    <div class="guide">${c.guide}</div>
  </div>`;
}

function alignBlock(d,c){
  const rows=[["세션",d.dir.session],["일간",d.dir.daily],["주간",d.dir.weekly]];
  let body=rows.map(([k,r])=>{
    const trend=Math.abs(r.strength)>r.avg;
    const reach=(r.levels&&r.levels.length)?r.levels[r.levels.length-1].reach:null;
    return `<tr><td class="k">${k}</td>
      <td style="background:${heatStr(r.strength)}">${arw(r.strength)} ${f(Math.abs(r.strength),0)}<span class="sub">${trend?"추세":"횡보"}</span></td>
      <td style="background:${heatReach(reach)}">${reach!=null?f(reach,0)+"%":"–"}</td>
      <td style="background:${heatTv(r.tickvol_pct)}">${f(r.tickvol_pct,0)}%</td></tr>`;
  }).join("");
  const H=d.dir.h4, h4t=Math.abs(H.done)>H.avg;
  body+=`<tr><td class="k">H4</td>
    <td style="background:${heatStr(H.done)}">${arw(H.done)} ${f(Math.abs(H.done),0)}<span class="sub">${h4t?"추세":"횡보"}</span></td>
    <td class="empty">위치 ${f(H.h1pos,0)}%</td><td class="empty">–</td></tr>`;
  return `<div class="card"><div class="c-h"><span class="n">1</span><h2>정렬 — 층이 한 방향인가</h2></div>
    ${readBox(c.alignTone,c.alignRead)}
    <table class="mtx"><thead><tr><th></th><th>방향강도</th><th>도달률</th><th>틱볼륨</th></tr></thead><tbody>${body}</tbody></table>
    <div class="legend"><span class="down">하락</span>
      <span class="sw" style="background:linear-gradient(90deg,${mix('var(--down)',60)},var(--surface),${mix('var(--up)',60)})"></span>
      <span class="up">상승</span><span style="margin-left:5px">· 진할수록 강함</span></div>
  </div>`;
}

function spotBlock(d,c){
  const price=d.price;
  const sets=[["세션",d.dir.session],["일간",d.dir.daily],["주간",d.dir.weekly]];
  const bars=sets.map(([k,r])=>{
    if(!r.levels||!r.levels.length) return "";
    const L=r.levels[r.levels.length-1];
    const dn=L.dn, up=L.up, reach=L.reach, rdir=L.dir;
    let pct=(price-dn)/(up-dn)*100;
    let over="";
    if(pct<0){over=`<span class="rb-over down" style="left:2px">◀ 돌파</span>`; pct=0;}
    else if(pct>100){over=`<span class="rb-over up" style="right:2px">돌파 ▶</span>`; pct=100;}
    const rc=rdir<0?"down":(rdir>0?"up":"flat");
    return `<div class="rb">
      <div class="rb-h"><span class="k">${k}</span><span class="r ${rc}">도달 ${f(reach,0)}%</span></div>
      <div class="rb-track">${over}<span class="rb-dot" style="left:${pct}%"></span></div>
      <div class="rb-cap"><span>하단 ${money(dn)}</span><span>현재 ${money(price)}</span><span>상단 ${money(up)}</span></div>
    </div>`;
  }).join("");
  return `<div class="card"><div class="c-h"><span class="n">2</span><h2>자리 — 레벨 대비 위치</h2><span class="hint">● 현재가</span></div>
    ${readBox(c.spotTone,c.spotRead)}${bars}</div>`;
}

function domMeter(dom){
  const r=Math.max(-100,Math.min(100,(dom||0)*10)), half=Math.abs(r)/100*50;
  const side=r>=0?`left:50%;width:${half}%`:`right:50%;width:${half}%`, cc=r>=0?"up":"down";
  return `<div class="track"><div class="mid"></div><div class="fill ${cc}" style="${side}"></div></div>`;
}
function forceBlock(d,c){
  const fl=d.flow, h=fl&&fl.h4;
  if(!h||!h.valid) return `<div class="card"><div class="c-h"><span class="n">3</span><h2>힘 — 체결 흐름</h2></div>${readBox("flat",c.forceRead)}</div>`;
  const bars=(fl.zone&&fl.zone.bars)||[];
  const maxD=Math.max(...bars.map(b=>Math.abs(b.dom)),0.1);
  const spark=bars.map(b=>{
    const ht=Math.max(8,Math.abs(b.dom)/maxD*100), cc=b.dom<0?"var(--down)":"var(--up)";
    return `<div class="col"><div class="bar" style="height:${ht}%;background:${cc}"></div><div class="lb">${b.tag}</div></div>`;
  }).join("");
  const trendTxt = bars.length? (bars[bars.length-1].dom<bars[0].dom?"매도 강해짐 ▼":(bars[bars.length-1].dom>bars[0].dom?"매수 강해짐 ▲":"유지")) : "";
  const e=fl.entry, dn=e&&e.done, nw=e&&e.now;
  const cmp = (dn&&nw)?`<div class="cmp2">
      <span class="k">완성(-1) → 진행 (${e.tf})</span>
      <span class="a">체결 ${sg(dn.dom,1)}%</span><span class="ar">→</span><span class="b ${cls(nw.dom)}">${sg(nw.dom,1)}%</span>
      <span class="a">효율 ${f(dn.eff,2)}</span><span class="ar">→</span><span class="b">${f(nw.eff,2)}</span>
      <span class="a">실이동 ${sg(dn.move,1)}</span><span class="ar">→</span><span class="b ${cls(nw.move)}">${sg(nw.move,1)}${d.ptl||""}</span>
    </div>`:"";
  return `<div class="card"><div class="c-h"><span class="n">3</span><h2>힘 — 체결 흐름</h2><span class="hint">최근 4H</span></div>
    ${readBox(c.forceTone,c.forceRead)}
    <div class="cap"><span>매도</span><span>매수</span></div>${domMeter(h.dom)}
    <div class="cap"><span>순 방향성 (↑${(h.up||0).toLocaleString()}/↓${(h.down||0).toLocaleString()})</span><span class="rt ${cls(h.dom)}">${sg(h.dom,1)}%</span></div>
    <div class="spark-wrap"><div class="spark-h"><span class="t">체결 우위 추세 (${fl.zone.tf})</span><span class="c ${cls(bars.length?bars[bars.length-1].dom:0)}">${trendTxt}</span></div>
      <div class="spark">${spark}</div></div>
    ${cmp}</div>`;
}

function render(d){
  CUR=d.cur||""; PTL=d.ptl||"핍";
  $("#sym").textContent=d.sym||"—";
  $("#sess").textContent=d.session||"—";
  $("#price").textContent=d.price!=null?money(d.price):"—";
  const c=ctxOf(d);
  $("#app").innerHTML = heroBlock(d,c)+alignBlock(d,c)+spotBlock(d,c)+forceBlock(d,c);
}

/* ===== live ===== */
let timer=null;
function setStatus(kind,msg){$("#dot").className="dot "+(kind||"");$("#status").textContent=msg;$("#banner").style.display=kind==="live"?"none":"block";}
async function tick(){
  const url=localStorage.getItem(LS.url);
  if(!url){render(SAMPLE);setStatus("sample","샘플 데이터");return;}
  try{
    const res=await fetch(url,{cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    let data=await res.json(); if(data&&data.payload)data=data.payload;
    render(data);
    const t=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    setStatus("live","실시간 · "+t+" 갱신"+(data.kst?" (봉 "+data.kst+")":""));
  }catch(e){render(SAMPLE);setStatus("sample","연결 실패 — 샘플 표시 ("+e.message+")");}
}
function loop(){if(timer)clearInterval(timer);const ivl=Math.max(10,parseInt(localStorage.getItem(LS.ivl)||"30",10))*1000;tick();if(localStorage.getItem(LS.url))timer=setInterval(tick,ivl);}
const dlg=$("#cfg");
$("#gear").onclick=()=>{$("#url").value=localStorage.getItem(LS.url)||"";$("#ivl").value=localStorage.getItem(LS.ivl)||"30";dlg.showModal();};
$("#save").addEventListener("click",()=>{const u=$("#url").value.trim(),v=$("#ivl").value.trim()||"30";if(u)localStorage.setItem(LS.url,u);else localStorage.removeItem(LS.url);localStorage.setItem(LS.ivl,v);setTimeout(loop,30);});
try{loop();}catch(e){render(SAMPLE);setStatus("sample","샘플 데이터");}
</script>
