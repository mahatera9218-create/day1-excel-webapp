<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="프로파일">
<link rel="apple-touch-icon" href="icon-profile.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23e79a1e'/%3E%3Crect x='6' y='8' width='11' height='3' rx='1' fill='%23070a0e'/%3E%3Crect x='6' y='13' width='17' height='3' rx='1' fill='%23070a0e'/%3E%3Crect x='6' y='18' width='20' height='3' rx='1' fill='%23070a0e'/%3E%3Crect x='6' y='23' width='9' height='3' rx='1' fill='%23070a0e'/%3E%3C/svg%3E">
<title>XAUUSD 프로파일</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#05070a; --surface:#0a0e13; --surface2:#10151d; --inset:#0c1015;
  --ink:#e4e8ee; --muted:#8b939f; --faint:#545c67; --line:#1b222d; --grid:#131922;
  --accent:#ffab2e; --accent2:#46b8e6;
  --up:#ffffff; --up-bg:rgba(255,255,255,.10); --up-dim:#c9ced6;
  --down:#79828e; --down-bg:rgba(121,130,142,.16);
  --live:#ffab2e; --live-bg:rgba(255,171,46,.14);
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:14px;line-height:1.3;margin:0;padding:0 10px 40px;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto}
.hd{position:sticky;top:0;background:var(--bg);z-index:5;padding:calc(env(safe-area-inset-top,0px) + 12px) 2px 8px;border-bottom:1px solid var(--line);margin-bottom:6px}
.hrow{display:flex;align-items:baseline;gap:8px}
.hd .t{font-size:14px;font-weight:700;letter-spacing:.05em;color:var(--accent)}
.hd .t .sub{color:var(--muted);font-weight:600;font-size:11px;letter-spacing:.02em}
.hd .live{margin-left:auto;font-size:13px;font-weight:700}
.hd .live .a{color:var(--muted);font-weight:500}
.gear{background:var(--surface2);border:1px solid var(--line);color:var(--muted);border-radius:4px;padding:3px 8px;font:inherit;font-size:10px;font-weight:600;cursor:pointer;margin-left:8px}
.meta{font-size:10px;color:var(--muted);margin-top:6px;line-height:1.6}
.meta b{color:var(--ink);font-weight:600}.meta .k{color:var(--faint)}
.stamp{font-size:9px;color:var(--faint);margin-top:3px}
.cfg{display:none;margin-top:8px;padding:8px;border:1px solid var(--line);border-radius:5px;background:var(--surface)}
.cfg.on{display:block}
.cfg input{width:100%;background:var(--inset);border:1px solid var(--line);color:var(--ink);font:inherit;font-size:11px;padding:6px 8px;border-radius:4px;margin:3px 0}
.cfg .row2{display:flex;gap:6px;align-items:center}
.cfg button{background:var(--accent);color:#05070a;border:0;font:inherit;font-weight:700;font-size:11px;padding:6px 12px;border-radius:4px;cursor:pointer}
.cfg label{font-size:9.5px;color:var(--faint)}

.tbl{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed}
.tbl th{color:var(--faint);font-weight:600;font-size:10px;text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);letter-spacing:.02em;text-transform:uppercase}
.tbl td{padding:4px 4px;border-bottom:1px solid var(--grid);white-space:nowrap}
.pr{color:var(--muted);font-size:11.5px}
.barwrap{display:flex;align-items:center;gap:2px;width:100%}
.brk{color:var(--faint);font-size:12px}
.track{flex:1;height:13px;background:var(--inset);border:1px solid var(--grid);position:relative;overflow:hidden}
.fill{position:absolute;left:0;top:0;bottom:0}
.fill.w3{background:linear-gradient(90deg,var(--up-dim),#8b939f)}
.fill.w1{background:linear-gradient(90deg,#6f96b8,var(--accent2))}
.dl{text-align:right;font-weight:600;font-size:12px}
.dl.p{color:var(--up-dim)}.dl.n{color:var(--down)}.dl.z{color:var(--faint)}
.rm{color:var(--accent);font-size:9px;font-weight:700;display:block;line-height:1.4;white-space:nowrap}
.rmc{white-space:normal}
tr.live td{background:var(--live-bg)}
tr.live .pr{color:var(--live);font-weight:700}
.fill.pocbar.w3{background:linear-gradient(90deg,#ffe0a0,#ffab2e)}
.fill.pocbar.w1{background:linear-gradient(90deg,#8fd0f2,#46b8e6)}
.pocdot{font-size:11px;line-height:1;margin-left:1px;flex:0 0 auto}
.pocdot.w3{color:var(--accent)} .pocdot.w1{color:var(--accent2)}
.foot{font-size:9px;color:var(--faint);margin-top:8px;line-height:1.6;padding:0 2px}
.lgd{display:flex;gap:14px;margin-top:6px;font-size:9.5px;color:var(--muted)}
.lgd .sw{display:inline-block;width:16px;height:8px;vertical-align:0;margin-right:4px;border:1px solid var(--grid)}
.empty{padding:30px 10px;text-align:center;color:var(--faint);font-size:11px}
</style>
<div class="wrap">
  <div class="hd">
    <div class="hrow">
      <span class="t">[<span id="sym">XAUUSD</span>] <span class="sub">TICK PROFILE · 3W vs 1W</span></span>
      <span class="live" id="live"></span>
      <button class="gear" id="gear">⚙</button>
    </div>
    <div class="meta" id="meta"></div>
    <div class="stamp" id="stamp"></div>
    <div class="cfg" id="cfg">
      <label>팬트리 바스켓 URL (프로파일 전용)</label>
      <input id="url" placeholder="https://getpantry.cloud/apiv1/pantry/…/basket/…">
      <div class="row2"><label>폴링(초)</label><input id="ivl" style="width:70px" value="30"><button id="save">저장</button></div>
    </div>
  </div>
  <table class="tbl">
    <thead><tr>
      <th style="width:66px">PRICE</th><th>3W TICKS</th><th>1W TICKS</th>
      <th style="text-align:right;width:40px">3W Δ</th><th style="text-align:right;width:40px">1W Δ</th><th style="width:76px"></th>
    </tr></thead>
    <tbody id="body"></tbody>
  </table>
  <div class="lgd">
    <span><span class="sw" style="background:#8b939f"></span>3W 틱</span>
    <span><span class="sw" style="background:var(--accent2)"></span>1W 틱</span>
    <span style="color:var(--accent)">◆ 3W POC</span>
    <span style="color:var(--accent2)">◆ 1W POC</span>
  </div>
  <div class="foot">◆ POC = 그 기간 최다 체결 가격(제일 긴 막대) = 가장 강한 벽·자석 · <b style="color:var(--accent)">앰버=3주</b>(큰 벽) / <b style="color:var(--accent2)">파랑=1주</b>(최근 벽) · 얇은 구간 = 빠른 이동 · Δ = 매수−매도 우위
    <span style="opacity:.6"> · build 2026-09-15g</span></div>
</div>
<script>
const $=s=>document.querySelector(s);
const LS={url:"prof_url",ivl:"prof_ivl"};
const m2=v=>"$"+Number(v).toFixed(2);
const nf=v=>Number(v).toLocaleString("en-US");
const sg=v=>(v>0?"+":v<0?"−":"")+Math.abs(v).toFixed(1);

/* ===== 샘플 (실제 JSON 스키마와 동일 · 고정 데모값 = 새로고침해도 불변) ===== */
const rnd=n=>{const x=Math.sin(n*12.9898)*43758.5453;return x-Math.floor(x);};
function sample(){
  const D1={open:4298.52,high:4317.37,low:4263.62}, LIVE=4264.96, BID=4264.96, ASK=4265.05, BUCKET=2, HI=4340, LO=4252, peak=4330, sig=13;
  const rows=[]; let i=0;
  for(let hi=HI; hi>LO; hi-=BUCKET,i++){
    const lo=hi-BUCKET, mid=(hi+lo)/2, g=Math.exp(-((mid-peak)**2)/(2*sig*sig));
    let t3=Math.round(2000+54000*g+(rnd(i)*3000-1500)); if(mid<4266)t3=Math.round(t3*0.12);
    let t1=Math.round(t3*(0.55+0.25*rnd(i+100))); if(mid<4300&&mid>4288)t1=Math.round(t1*1.4);
    const e3=+(rnd(i+200)*6-3.2).toFixed(1), e1=+(e3+(rnd(i+300)*2-1)).toFixed(1);
    let mark=null;
    if(hi>D1.high&&lo<=D1.high)mark="HIGH"; if(hi>LIVE&&lo<=LIVE)mark="LIVE";
    if(hi>D1.low&&lo<=D1.low)mark="LOW"; if(hi>D1.open&&lo<=D1.open)mark="OPEN";
    rows.push({hi,lo,t3,e3,t1,e1,mark});
  }
  return {sym:"XAUUSD (데모)",bid:BID,ask:ASK,live:LIVE,bucket:BUCKET,kst:"샘플",d1:D1,
    sample:{w3:rows.reduce((s,r)=>s+r.t3,0),w1:rows.reduce((s,r)=>s+r.t1,0)},rows};
}

function render(d){
  $("#sym").textContent=d.sym||"—";
  $("#live").innerHTML=`${m2(d.bid)} <span class="a">/ ${Number(d.ask).toFixed(2)}</span>`;
  const D=d.d1||{};
  $("#meta").innerHTML=
    `<span class="k">D1</span> O <b>${m2(D.open)}</b> · H <b>${m2(D.high)}</b> · L <b>${m2(D.low)}</b><br>`+
    `<span class="k">SAMPLE</span> 3W <b>${nf(d.sample?d.sample.w3:0)}</b> · 1W <b>${nf(d.sample?d.sample.w1:0)}</b> ticks &nbsp; <span class="k">BUCKET</span> $${Number(d.bucket||2).toFixed(0)}`;
  const rows=d.rows||[];
  if(!rows.length){ $("#body").innerHTML=`<tr><td colspan="6"><div class="empty">데이터 없음 — EA 전송/URL 확인</div></td></tr>`; return; }
  // 공통 스케일: 3W·1W 같은 기준 → 1W가 3W 대비 실제 비율로 보임
  const mx=Math.max(1,...rows.map(r=>r.t3||0),...rows.map(r=>r.t1||0));
  const bar=(v,cls,poc)=>{const w=Math.max(0,Math.round((v||0)/mx*100));
    return `<div class="barwrap"><span class="brk">[</span><div class="track"><div class="fill ${cls}${poc?' pocbar':''}" style="width:${w}%"></div></div><span class="brk">]</span>${poc?`<span class="pocdot ${cls}">◆</span>`:''}</div>`;};
  const dlc=v=>v>0.05?"p":(v<-0.05?"n":"z");
  // POC = 최다 체결 버킷 (3W·1W 각각)
  let p3=0,v3=-1,p1=0,v1=-1;
  rows.forEach((r,i)=>{ if((r.t3||0)>v3){v3=r.t3||0;p3=i;} if((r.t1||0)>v1){v1=r.t1||0;p1=i;} });
  $("#body").innerHTML=rows.map((r,i)=>{
    const hi=Number(r.hi),lo=Number(r.lo);
    let rm="";
    if(i===p3&&v3>0) rm+=`<span class="rm" style="color:var(--accent)">◆ 3W POC</span>`;
    if(i===p1&&v1>0) rm+=`<span class="rm" style="color:var(--accent2)">◆ 1W POC</span>`;
    if(r.mark) rm+=`<span class="rm">← ${r.mark}</span>`;
    return `<tr class="${r.mark==='LIVE'?'live':''}">
      <td class="pr">${hi.toFixed(0)}~${lo.toFixed(0)}</td>
      <td>${bar(r.t3,"w3",i===p3&&v3>0)}</td>
      <td>${bar(r.t1,"w1",i===p1&&v1>0)}</td>
      <td class="dl ${dlc(r.e3)}">${sg(r.e3||0)}%</td>
      <td class="dl ${dlc(r.e1)}">${sg(r.e1||0)}%</td>
      <td class="rmc">${rm}</td></tr>`;
  }).join("");
}
function setStamp(t){ $("#stamp").textContent=t; }

let timer=null;
async function tick(){
  const url=localStorage.getItem(LS.url);
  if(!url){ render(sample()); setStamp("● 샘플 모드 — ⚙에서 URL 설정"); return; }
  try{
    const r=await fetch(url,{cache:"no-store"}); const j=await r.json();
    render(j); setStamp("● 실시간 "+(j.kst||""));
  }catch(e){ render(sample()); setStamp("● 연결 실패 · 샘플 표시"); }
}
function loop(){ if(timer)clearInterval(timer); const s=Math.max(10,parseInt(localStorage.getItem(LS.ivl)||"30",10)); tick(); if(localStorage.getItem(LS.url))timer=setInterval(tick,s*1000); }

$("#gear").addEventListener("click",()=>{ $("#cfg").classList.toggle("on"); $("#url").value=localStorage.getItem(LS.url)||""; $("#ivl").value=localStorage.getItem(LS.ivl)||"30"; });
$("#save").addEventListener("click",()=>{ const u=$("#url").value.trim(),v=$("#ivl").value.trim()||"30"; if(u)localStorage.setItem(LS.url,u); else localStorage.removeItem(LS.url); localStorage.setItem(LS.ivl,v); $("#cfg").classList.remove("on"); loop(); });
loop();
</script>
